<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#012F51">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Road to 10k">
<meta name="description" content="Instagram content calendar, post log and growth tracker for @mattwade_____. Data stays on this device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Road to 10k</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
html{color-scheme:light dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{
  --bg:#F4F8FB; --surface:#FFFFFF; --surface2:#E9F1F7; --line:#CBDCE8;
  --ink:#012F51; --ink2:#3B5A73; --muted:#6E8AA0;
  --accent:#1A7FB0; --accent-ink:#FFFFFF; --accent-soft:#D6ECF7;
  --good:#2E8B57; --good-soft:#DDF2E5; --warn:#B8780A; --warn-soft:#F7EBD2; --bad:#C24A62; --bad-soft:#F8DEE4;
  --p1:#1A7FB0; --p2:#4A9A3A; --p3:#7A5AD6; --p4:#C24A62; --p5:#B8780A;
  --shadow:0 1px 2px rgba(1,47,81,.06),0 6px 20px rgba(1,47,81,.08);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#012F51; --surface:#063A5F; --surface2:#0B4670; --line:#1E5A85;
    --ink:#FFFFFF; --ink2:#C9E2F0; --muted:#9CC4DA;
    --accent:#66CDF0; --accent-ink:#012F51; --accent-soft:#0F4E78;
    --good:#4FBF7A; --good-soft:#0F4A36; --warn:#E3A93C; --warn-soft:#4A3A12; --bad:#F07A93; --bad-soft:#5A2233;
    --p1:#2E9FD0; --p2:#3FA05C; --p3:#8A6FE0; --p4:#C9506B; --p5:#B8801A;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#012F51; --surface:#063A5F; --surface2:#0B4670; --line:#1E5A85;
  --ink:#FFFFFF; --ink2:#C9E2F0; --muted:#9CC4DA;
  --accent:#66CDF0; --accent-ink:#012F51; --accent-soft:#0F4E78;
  --good:#4FBF7A; --good-soft:#0F4A36; --warn:#E3A93C; --warn-soft:#4A3A12; --bad:#F07A93; --bad-soft:#5A2233;
  --p1:#2E9FD0; --p2:#3FA05C; --p3:#8A6FE0; --p4:#C9506B; --p5:#B8801A;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px 8px}
header.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:820px;margin:0 auto;padding-inline:16px}
.brand{display:flex;flex-direction:column;gap:0}
.brand .h{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand .s{font-size:12px;color:var(--muted)}
.streak{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;font-weight:600;white-space:nowrap}
.streak .n{font-size:20px;font-weight:700;line-height:1}
.streak.ok .n{color:var(--good)} .streak.broken{background:var(--bad-soft);border-color:var(--bad)} .streak.broken .n{color:var(--bad)}
.streak.zero .n{color:var(--muted)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px;font-weight:600}
h3{font-size:16px;margin:0 0 6px;font-weight:600;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card + .card{margin-top:10px}
.today{border-left:4px solid var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tile .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:26px;font-weight:700;line-height:1.1;margin-top:4px}
.tile .d{font-size:12px;color:var(--ink2);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;border:1px solid transparent;white-space:nowrap}
.chip.PLANNED{background:transparent;border-color:var(--line);color:var(--ink2)}
.chip.FILMED{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip.POSTED{background:var(--good-soft);color:var(--good)}
.chip.SKIPPED{background:var(--bad-soft);color:var(--bad)}
.chip.EVERGREEN{background:var(--surface2);color:var(--ink2)}
.chip.TOPICAL{background:var(--warn-soft);color:var(--warn)}
.chip.fmt{background:var(--surface2);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.p1{background:var(--p1)} .p2{background:var(--p2)} .p3{background:var(--p3)} .p4{background:var(--p4)} .p5{background:var(--p5)}
.slot{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0;padding-top:4px}
.slot .when{display:flex;flex-direction:column;align-items:center;gap:1px;padding-top:2px}
.slot .when .d{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.slot .when .n{font-size:20px;font-weight:700;line-height:1}
.slot .when .t{font-size:11px;color:var(--muted)}
.slot .body{min-width:0}
.slot .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.slot .title{font-weight:600;font-size:15px}
.slot .hook{font-size:13.5px;color:var(--ink2);margin-top:2px}
.slot .act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.score{min-width:40px;text-align:center;padding:4px 8px;border-radius:8px;font-weight:700;font-size:14px}
.score.good{background:var(--good-soft);color:var(--good)} .score.mid{background:var(--warn-soft);color:var(--warn)} .score.poor{background:var(--bad-soft);color:var(--bad)} .score.na{background:var(--surface2);color:var(--muted);font-weight:500;font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 9px;font-size:12px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 6px}
.weeknav .wk{font-weight:700;font-size:16px}
.weeknav .rng{font-size:12px;color:var(--muted)}
.progress{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:var(--good);border-radius:999px}
.progress i.short{background:var(--warn)}
.storyline{font-size:13.5px;color:var(--ink2);white-space:pre-line}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around}
.tab{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:10px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{position:sticky;top:0;background:var(--surface2);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;user-select:none}
th.on{color:var(--accent)}
td.hookcell{white-space:normal;min-width:220px;max-width:340px}
tr.rowgood td:first-child{box-shadow:inset 4px 0 0 var(--good)} tr.rowmid td:first-child{box-shadow:inset 4px 0 0 var(--warn)} tr.rowpoor td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 10px}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
svg.chart{width:100%;height:auto;display:block;touch-action:none}
svg.chart text{fill:var(--muted);font-size:10px;font-family:inherit}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .pace{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
svg.chart .line{stroke:var(--accent);stroke-width:2;fill:none}
svg.chart .area{fill:var(--accent);opacity:.12}
svg.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg.chart .pt.last{r:5}
svg.chart .goal{stroke:var(--good);stroke-width:1.5;stroke-dasharray:2 4}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;transform:translate(-50%,-120%);white-space:nowrap;display:none}
.chartbox{position:relative}
.bar{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.bar:first-child{border-top:0}
.bar .track{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:999px}
.bar .lab{display:flex;align-items:center;gap:7px;font-weight:600}
.bar .val{text-align:right;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hookrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.hookrow:first-child{border-top:0}
.hookrow .h{font-weight:500;font-size:14px}
.hookrow .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--ink2)}
.sheet-bg{position:fixed;inset:0;background:rgba(1,20,35,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:17px}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:15px;width:100%}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.statusbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.statusbtns button{border-radius:999px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.statusbtns button[aria-pressed="true"].PLANNED{border-color:var(--ink2);color:var(--ink)}
.statusbtns button[aria-pressed="true"].FILMED{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.statusbtns button[aria-pressed="true"].POSTED{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.statusbtns button[aria-pressed="true"].SKIPPED{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;z-index:30;box-shadow:var(--shadow)}
.conn{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.conn.on i{background:var(--good)} .conn.off i{background:var(--bad)}
.review{border-left:4px solid var(--warn)}
.review .one{font-weight:600;font-size:15px}
.moments{font-size:13px}
.moments div{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.moments div:first-child{border-top:0}
.moments .dt{color:var(--muted);font-weight:600}
.themes .card{padding:12px 14px}
.themes .wk{font-weight:700;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.small{font-size:12.5px;color:var(--muted)}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;text-decoration:none;color:var(--ink)}
.linkrow:first-of-type{border-top:0}
.linkrow .r{color:var(--accent);font-weight:700;flex:none}
.linkrow .n{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.newsitem{padding:10px 0;border-top:1px solid var(--line)}
.newsitem:first-child{border-top:0}
.newsitem .t{font-weight:600;font-size:14.5px}
.newsitem .m{font-size:13px;color:var(--ink2);margin-top:3px}
.rhythm{display:grid;grid-template-columns:44px 1fr auto;gap:8px 10px;font-size:13px;align-items:center}
.rhythm .d{font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.script{font-size:16px;line-height:1.55;white-space:pre-line;padding:12px 14px;border-radius:12px;background:var(--surface2);margin-top:8px}
.script .hookline{font-weight:600}
.slides{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.slide{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.slide:first-child{border-top:0}
.slide .n{font-weight:700;color:var(--accent);font-size:12px;padding-top:2px}
.slide .h{font-weight:600;color:var(--accent);font-size:13px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13px;margin-top:8px}
.kv .k{color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:11px;padding-top:2px}
details.cap{margin-top:8px}
details.cap summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--accent)}
details.cap pre{white-space:pre-wrap;font:inherit;font-size:13.5px;background:var(--surface2);padding:10px 12px;border-radius:10px;margin:6px 0 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.prompter{position:fixed;inset:0;z-index:40;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.prompter .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid var(--line)}
.prompter .txt{flex:1;overflow:auto;padding:24px 20px calc(40vh + env(safe-area-inset-bottom,0px));white-space:pre-line;line-height:1.5;font-weight:500;text-wrap:pretty}
.prompter .txt p{margin:0 0 .9em}
.empty{color:var(--muted);font-size:13.5px;padding:10px 0}
@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .22s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div class="brand">
      <div class="h">Road to 10k</div>
      <div class="s"><span id="handle"></span> &middot; <span id="followersHead" class="num"></span> followers &middot; <span class="conn" id="conn"><i></i><span>connecting</span></span></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px"><button class="btn small" id="dataBtn" aria-label="Backup and sync" title="Backup and sync">Sync</button>
    <div class="streak zero" id="streak" title="Consecutive weeks hitting 8 posts">
      <span class="n num" id="streakN">0</span>
      <span id="streakL">week streak</span>
    </div></div>
  </div>
</header>

<main class="wrap">
  <section id="tab-week"></section>
  <section id="tab-log" hidden></section>
  <section id="tab-growth" hidden></section>
  <section id="tab-insights" hidden>
    <div class="seg" style="margin:14px 0 4px" id="insSeg"><button data-v="pillars" aria-pressed="true">Pillars</button><button data-v="hooks" aria-pressed="false">Hooks</button></div>
    <div id="tab-pillars"></div>
    <div id="tab-hooks" hidden></div>
  </section>
  <section id="tab-news" hidden></section>
  <section id="tab-scripts" hidden></section>
</main>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" data-tab="week" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>This week</button>
  <button class="tab" role="tab" data-tab="log" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Log</button>
  <button class="tab" role="tab" data-tab="growth" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Growth</button>
  <button class="tab" role="tab" data-tab="insights" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Insights</button>
  <button class="tab" role="tab" data-tab="news" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>News</button>

OneDrive/Documents/CONTENT/You are my personal Social Media St.txt (14 Sep 2026)", "horizonWeeks": 2, "template": [{"day": "Wed", "format": "Reel", "lane": "A", "pillar": 2, "time": "12:30", "note": "The Number. One figure, one reveal. Topical lean, filmed on batch day from the freshest print."}, {"day": "Thu", "format": "Carousel", "lane": "-", "pillar": 1, "time": "12:30", "note": "Economics behind the market, with the client implication."}, {"day": "Fri", "format": "Reel", "lane": "B", "pillar": 4, "time": "06:45", "note": "Deal breakdown. The long one, 60 to 90 seconds, de-identified, told for clients."}, {"day": "Sat", "format": "Carousel", "lane": "-", "pillar": 5, "time": "08:30", "note": "My journey. The 10k build in public, batch day, what went wrong."}, {"day": "Sun", "format": "Carousel", "lane": "-", "pillar": 3, "time": "08:30", "note": "What the bank won't say, in slides. The Sunday scroll."}, {"day": "Mon", "format": "Reel", "lane": "A", "pillar": 3, "time": "06:45", "note": "What the bank won't say, on camera. The antagonist reel opens the working week."}, {"day": "Mon", "format": "Carousel", "lane": "-", "pillar": 2, "time": "17:30", "note": "The Number in slides. Data slide with three columns."}, {"day": "Tue", "format": "Reel", "lane": "A", "pillar": 1, "time": "06:45", "note": "Economics reel, or the live react when a decision lands on a Tuesday (RBA)."}], "templateRule": "Days and pillars are locked. Topics are not. A rate decision, lender policy change, APRA move, Budget, market print or viral property story takes the slot for that day in its pillar, or bumps the nearest slot if it does not fit any. Only two weeks are planned at a time: this week in detail, next week in detail, then themes only.", "news": {"searches": [{"pillar": 1, "label": "RBA cash rate decision", "url": "https://news.google.com/search?hl=en-AU&gl=AU&ceid=AU:en&q=RBA%20cash%20rate%20decision"}, {"pillar": 1, "label": "Cotality home value index", "url": "https://news.google.c st word. Number on screen the moment you say it, held two seconds. Sentence case captions, Poppins Bold, white with sky emphasis. Disclaimer muted grey in the final three seconds. Credit rep line on every caption."}, {"id": "W2", "n": 2, "start": "2026-09-23", "end": "2026-09-29", "theme": "RBA week on the locked rhythm. Investor lending fell off a cliff, 1,432 homes, the self-employed deal, loyalty tax the day before the decision, and a live react on Tuesday 29 Sep.", "batch": "2026-09-23", "notes": "NSW school holidays start Sat 26 Sep. RBA decision Tue 29 Sep 2:30pm, 15-minute filming window 2:45 to 3:00pm. Scripts for this week arrive with the Sunday 20 Sep import, or ask for them earlier. Batch films Wed 23 Sep."}, {"id": "W3", "n": 3, "start": "2026-09-30", "end": "2026-10-06", "theme": "Themes only. Detailed slots come from the Sunday review one week ahead. Aftermath and structure. RBA pass-through, the Cotality September print, leverage philosophy, first numbers in public.", "batch": "2026-09-30", "notes": "Cotality print expected Thu 1 Oct (pattern, unconfirmed). Daylight saving starts Sun 4 Oct. Labour Day public holiday Mon 5 Oct, school holidays all week. Expect softer weekday reach."}, {"id": "W4", "n": 4, "start": "2026-10-07", "end": "2026-10-13", "theme": "Themes only. Detailed slots come from the Sunday review one week ahead. Who funds you and what the bank tests. Rents at a third of income, the buffer, non-bank funding, a deal that nearly died.", "batch": "2026-10-07", "notes": "Term 4 starts Tue 13 Oct. RBA September minutes Tue 13 Oct. Affordability stat in W4-07 must be verified to a primary source before it posts."}], "moments": [{"date": "2026-09-18", "event": "RBA Governor Bullock, House Economics Committee", "confirmed": true, "use": "Story share with one-line take. Not a slot."}, {"date": "2026-09-22", "event": "Bullock CEDA fireside", "confirmed": true, "use": "Story share if anything quotable on inflation."}, {"date": "2026-09-25", "event ors, September quarter, 11:30am", "confirmed": true, "use": "W9 the-number slot. Now quarterly, no October release."}, {"date": "2026-12-01", "event": "Cotality November print (pattern)", "confirmed": false, "use": "W11 topical."}, {"date": "2026-12-08", "event": "RBA cash rate decision, last for 2026", "confirmed": true, "use": "W12 live react slot."}, {"date": "2026-12-10", "event": "NAB AGM", "confirmed": true, "use": "Story share only."}, {"date": "2026-12-17", "event": "MYEFO expected mid-December (2025 was 17 Dec)", "confirmed": false, "use": "Housing measures if any."}, {"date": "2026-12-18", "event": "NSW summer holidays start. Christmas shutdown period to late January", "confirmed": true, "use": "Pre-record two weeks of evergreen. Lender settlement cut-offs land early December."}, {"date": "2027-02-09", "event": "RBA first decision of 2027", "confirmed": true, "use": "Plan the January evergreen bank around it."}, {"date": "2027-06-01", "event": "HELP indexation date", "confirmed": true, "use": "HECS content in late May 2027."}], "slots": [{"id": "W1-01", "week": "W1", "date": "2026-09-16", "day": "Wed", "time": "12:30", "format": "Reel", "lane": "A", "pillar": 3, "type": "news", "title": "Cutting and raising at the same time", "hook": "Banks are cutting rates two weeks before the RBA might raise them.", "angle": "Dozens of lenders cut variable rates for new customers over the past month (ABC, 14 Sep) while markets price roughly an 80% chance of a rise on 29 Sep. Banks are fighting over a shrinking pool of borrowers, so the discount goes to whoever asks. Existing customers get nothing unless they ask.", "kind": "TOPICAL", "filmWindow": "Films today in the batch. Numbers hold until 29 Sep.", "cta": "Save this for the day after the 29th.", "disclaimer": "scenario", "onScreen": "Cutting for new customers. Raising for everyone.", "status": "SKIPPED", "skipReason": "deliberate", "notes": "System built Wednesday evening, no batch filmed 16 Sep. Angle rolls into the reprice window reel W3-01 and the RBA react W2-08.", "script": {"setup": "Desk, phone, Lane A. Outfit 1.", "order": 1, "words": 94, "seconds": 35, "spoken": "Banks are cutting rates two weeks before the RBA might raise them.\n\nRead that again.\n\nDozens of lenders have cut variable rates in the past month. For new customers.\n\nAt the same time, markets are pricing about an 80 per cent chance the Reserve Bank lifts the cash rate on the 29th.\n\nBoth can be true. Banks are fighting over a shrinking pool of borrowers, so the discount goes to whoever walks in the door.\n\nIf you've been with your bank more than a year and haven't asked, you're funding that discount.\n\nAsk before the 29th. It's a phone call.", "onScreen": "Cutting for new customers. Raising for everyone.", "numbers": "\"80%\" at the pricing line. \"29 Sept\" at the close.", "disclaimerText": "This is a scenario, not a forecast. General market commentary only, not advice.", "caption": "Banks are cutting rates two weeks before the RBA might raise them.\n\nDozens of lenders cut variable rates in the past month. For new customers. Meanwhile markets price about an 80% chance of a cash rate rise on 29 September.\n\nBoth are true. Banks are fighting over fewer borrowers, so the discount goes to whoever asks.\n\nIf you haven't asked in a year, you're funding it.\n\nSave this for the day after the 29th.\n\nThis is a scenario, not a forecast. General market commentary only, not advice. [credit rep line]\n\n#mortgagebroker #rba #interestrates #australianproperty #sydneyproperty #homeloans"}}, {"id": "W1-02", "week": "W1", "date": "2026-09-17", "day": "Thu", "time": "12:30", "format": "Carousel", "lane": "-", "pillar": 1, "type": "mechanism", "title": "Negative gearing is leaving the calculator", "hook": "Seven lenders cut investor borrowing power by up to 20%. Nobody sent you a letter.", "angle": "Since the Budget quarantined rental losses on established property bought after 12 May 2026 (from 1 July 2027), lenders have started removing the negative gearing add-back from how they assess investors. Same income, same rent, less borrowing. Describe the mechanism, do not name the lenders.", "kind": "TOPICAL", "filmWindow": "Build on batch day. Policy is set, numbers are stable.", "cta": "Send this to anyone bidding on an investment property this spring.", "disclaimer": "tax", "onScreen": "", "script": {"setup": "Carousel, build from the copy. Navy, sky headings, white body, 1080x1350. Do not name the lenders.", "order": 5, "slides": [["Cover", "Seven lenders cut investor borrowing power by up to 20%. Nobody sent you a letter."], ["What changed", "In the May Budget the government said rental losses on established property bought after 12 May 2026 stop offsetting your wages from 1 July 2027. New builds are exempt."], ["Why your bank cares", "For years lenders added the tax benefit of a rental loss back into your income when they assessed you. If the concession is going, so is the add-back."], ["Three columns", "Before: tax saving added back to income · Now: assessed on the cash shortfall alone · Result: up to 20% less borrowing on some calculators"], ["Who feels it", "The nine in ten investors with one or two properties, buying the next one this spring. Same job, same rent, smaller number."], ["The trade-off", "The new number is more honest. It's what the property actually costs you each month. Not a bad thing to know before you bid."], ["Close", "Get your capacity re-run before you bid. / Not after. A pre-approval from May might not be a pre-approval today."]], "disclaimerText": "Anything to do with tax or structuring is your accountant's call, not mine. Illustrative only, not a quote or an offer.", "caption": "Seven lenders cut investor borrowing power by up to 20%. Nobody sent you a letter.\n\nSince the Budget quarantined rental losses on established property bought after 12 May 2026 (from 1 July 2027), lenders have started removing the negative gearing add-back from how they assess investors.\n\nSame income. Same rent. Smaller number.\n\nThe new number is more honest, it's what the property actually costs you each month. But if you're bidding this spring on a pre-approval from May, get it re-run first.\n\nSend this to anyone bidding on an investment property this spring.\n\nAnything to do with tax or structuring is your accountant's call, not mine. Illustrative only, not a quote or an offer. General market commentary, not advice. [credit rep line]\n\n#negativegearing #propertyinvestor #borrowingpower #mortgagebroker #australianproperty"}}, {"id": "W1-03", "week": "W1", "date": "2026-09-18", "day": "Fri", "time": "06:45", "format": "Reel", "lane": "B", "pillar": 4, "type": "mechanism", "title": "The bank's favourite structure", "hook": "The bank's favourite loan structure is the one that costs you the most.", "angle": "Deal breakdown, de-identified composite. A client came in with a home and an investment property on one facility with one bank. Cross-collateralisation ties every property to every loan. Sell one and the bank revalues the lot and can hold the proceeds. We split them: ring-fenced loans keep each property's equity yours. Trade-off: more paperwork, sometimes two sets of fees, and it takes a broker who will do the work.", "kind": "EVERGREEN", "filmWindow": "Not filmed 16 Sep. Film in one 45-minute sitting Thu 17 or Fri 18 morning, or roll into the Wed 23 Sep batch and post in week 2.", "cta": "Save this before your next purchase.", "disclaimer": "general", "onScreen": "One loan, two houses. Guess who benefits.", "script": {"setup": "Desk plus a second angle 30 to 40 degrees off, Lane B. Outfit 2. Clap at the top of each take, cut to B on every point.", "order": 4, "words": 214, "seconds": 80, "spoken": "The bank's favourite loan structure is the one that costs you the most.\n\nIt's called cross-collateralisation, and most people who have it don't know they have it.\n\nHere's how it happens. You own your home. You buy an investment property. The bank offers to lend against both together. One facility, one application, less paperwork. Sounds helpful.\n\nNow here's what you actually signed.\n\nEvery property secures every loan. The bank has a claim over the lot.\n\nSell one, and the bank revalues everything before it lets go. If values have dipped, it can hold your sale proceeds to fix up the loan on the one you kept.\n\nWant to refinance one property to a better lender? You can't. They come as a set.\n\nAnd every valuation, every top-up, runs through one credit team's view of your whole position.\n\nThe alternative is ring-fencing. Each property, its own loan. Use equity from one as a cash deposit on the next, but keep the securities separate.\n\nThe trade-off is real. More paperwork, sometimes two sets of fees, and it takes a broker willing to do the work instead of ticking the bank's box.\n\nBut you keep your options. And over ten years, options are worth more than convenience.", "onScreen": "One loan, two houses. Guess who benefits. Then each point as text as you say it.", "numbers": "None. The four points appear as text on each turn.", "disclaimerText": "General market commentary only, not advice.", "caption": "The bank's favourite loan structure is the one that costs you the most.\n\nCross-collateralisation. One facility over your home and your investment. Less paperwork, and here's what you signed:\n\n→ every property secures every loan\n→ sell one and the bank revalues the lot first, and can hold your proceeds\n→ refinance one to a better lender? They come as a set\n→ every valuation runs through one credit team's view of everything\n\nThe alternative is ring-fencing. Each property, its own loan. Equity from one becomes a cash deposit on the next.\n\nThe trade-off: more paperwork, sometimes two sets of fees, and a broker willing to do the work.\n\nOver ten years, options beat convenience. Save this before your next purchase.\n\nGeneral market commentary only, not advice. [credit rep line]\n\n#propertyinvestor #loanstructure #mortgagebroker #australianproperty #investmentproperty"}}, {"id": "W1-04", "week": "W1", "date": "2026-09-19", "day": "Sat", "time": "08:30", "format": "Carousel", "lane": "-", "pillar": 5, "type": "process", "title": "742 to 10,000, in public", "hook": "742 followers. I'm taking this account to 10,000 in a year, and you get to watch.", "angle": "The commitment post. Where the account is, the goal, the system (4 reels, 4 carousels, one filming day a week), what I will share (real numbers every week, misses included) and what I will never share (client details, rate quotes, advice). Hold me to it.", "kind": "EVERGREEN", "filmWindow": "", "cta": "Follow to watch it happen, or watch it fail.", "disclaimer": "general", "onScreen": "", "script": {"setup": "Carousel, build from the copy.", "order": 6, "slides": [["Cover", "742 followers. I'm taking this account to 10,000 in a year, and you get to watch."], ["Where I'm starting", "742 followers on 14 September 2026. A broker's account that posts when it remembers to."], ["The goal", "10,000 by 14 September 2027. That's about 178 new followers a week, every week."], ["The system", "→ 4 reels and 4 carousels a week → one filming day, Wednesday → a story every day → a Sunday review with real numbers"], ["What you'll get", "The read on rates and prices nobody else is running. How lenders actually assess you. Structure over rate. The positions most brokers won't say on camera."], ["What you won't get", "Client details. Rate quotes. Advice dressed up as content. A post that reads like a bank wrote it."], ["Hold me to it", "Every Sunday I'll post the numbers. Posts planned, posts published, followers gained. Misses included."], ["Close", "Follow to watch it happen. / Or watch it fail. Either way you'll see the numbers."]], "disclaimerText": "General market commentary only, not advice.", "caption": "742 followers. I'm taking this account to 10,000 in a year, in public.\n\nThe system: ine if you know you are paying it.", "kind": "EVERGREEN", "filmWindow": "Not filmed 16 Sep. Film in one 45-minute sitting Thu 17 or Fri 18 morning, or roll into the Wed 23 Sep batch and post in week 2.", "cta": "", "disclaimer": "scenario", "onScreen": "Certainty has a price.", "script": {"setup": "Desk, phone, Lane A. Outfit 1.", "order": 2, "words": 93, "seconds": 35, "spoken": "Fixing your rate is buying insurance from the person who sets the price.\n\nOver a full cycle, variable has beaten fixed almost every time. The bank prices the fixed rate, and the bank is not in the business of losing that bet.\n\nRight now the best fixed rates sit above the best variable ones. So fixing today isn't a discount. It's a hedge.\n\nAnd a hedge is fine, if you know that's what you're buying.\n\nWho it's right for: the borrower who genuinely couldn't hold another rise.\n\nCertainty has a price. Just know you're paying it.", "onScreen": "Certainty has a price.", "numbers": "None. No rate numbers anywhere, above and below only.", "disclaimerText": "This is a scenario, not a forecast. General market commentary only, not advice.", "caption": "Fixing your rate is buying insurance from the person who sets the price.\n\nOver a full cycle, variable has beaten fixed almost every time. The bank sets the fixed price and it doesn't plan to lose.\n\nRight now fixed sits above variable, so fixing is a hedge, not a discount.\n\nWho it suits: the borrower who genuinely couldn't hold another rise. Certainty has a price. Know you're paying it.\n\nThis is a scenario, not a forecast. General market commentary only, not advice. [credit rep line]\n\n#fixedrate #mortgagebroker #homeloans #interestrates #australianproperty"}}, {"id": "W1-07", "week": "W1", "date": "2026-09-21", "day": "Mon", "time": "17:30", "format": "Carousel", "lane": "-", "pillar": 1, "type": "news", "title": "The dip they waited for is here", "hook": "Sydney is 7.1% off its peak and the buyers who waited for the dip are still wait <script>
(function(){
'use strict';
const PLAN = JSON.parse(document.getElementById('plan').textContent);
const S = PLAN.settings;
const PILLARS = Object.fromEntries(S.pillars.map(p=>[p.n,p]));
const DAY = 86400000;
const state = { slots:{}, growth:[], reviews:{}, meta:{}, db:null, dbState:'connecting', tab:'week', weekIdx:null, sort:{key:'date',dir:1}, filters:{format:'',pillar:'',status:'',week:''}, growthRange:'8w', pillarMetric:'score', insightsView:'pillars', news:[], newsFilter:0 };
PLAN.slots.forEach(s=>state.slots[s.id]={...s,status:s.status||'PLANNED',metrics:s.metrics||{}});
state.growth = PLAN.growth.slice();

// ---------- date helpers ----------
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const todayISO=()=>iso(new Date());
const fmtShort=s=>{const d=parse(s);return d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});};
const fmtDM=s=>{const d=parse(s);return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});};
const W1 = parse(PLAN.weeks[0].start);
const WEEKS=()=>(state.meta.weeks&&state.meta.weeks.length)?state.meta.weeks:PLAN.weeks;
const STORY=d=>(state.meta.stories&&state.meta.stories[d])||PLAN.stories[d]||'';
const MOMENTS=()=>(state.meta.moments&&state.meta.moments.length)?state.meta.moments:PLAN.moments;
function weekFor(dateISO){
  const d=parse(dateISO); const n=Math.floor((d-W1)/DAY/7);
  const known=WEEKS()[n];
  if(known) return known;
  const st=new Date(W1.getTime()+n*7*DAY), en=new Date(st.getTime()+6*DAY);
  return {id:'W'+(n+1),n:n+1,start:iso(st),end:iso(en),theme:'Not yet planned. The Sunday review fills this in.',notes:''};
}
function allWeeks(){
  const ids=new Set(WEEKS().map(w=>w.id));
  Object.values(state.slots).forEach(s=>{const w=weekFor(s.date);ids.add(w.id);});
  const t=weekFor(todayISO()); ids.add(t.id);
  return [...ids].map(id=>{const n=parseInt(id.slice(1),10);const st=new Date(W1.getTime()+(n-1)*7*DAY);return weekFor(iso(st));}).sort((a,b)=>a.n-b.n);
}

// ---------- metrics ----------
const num=v=>(v===''||v==null||isNaN(Number(v)))?null:Number(v);
function rates(s){
  const m=s.metrics||{}; const reach=num(m.reach);
  const r={reach, views:num(m.views), likes:num(m.likes), comments:num(m.comments), shares:num(m.shares), saves:num(m.saves), profileVisits:num(m.profileVisits), follows:num(m.follows), avgWatchPct:num(m.avgWatchPct)};
  const div=(a)=> (a!=null&&reach)?a/reach:null;
  r.shareRate=div(r.shares); r.saveRate=div(r.saves); r.followRate=div(r.follows); r.visitRate=div(r.profileVisits);
  const eng=[r.likes,r.comments,r.shares,r.saves].filter(v=>v!=null);
  r.engRate=(eng.length&&reach)?eng.reduce((a,b)=>a+b,0)/reach:null;
  r.replay=(r.views!=null&&reach)?r.views/reach:null;
  return r;
}
const median=a=>{if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;};
const WEIGHTS={reach:.25,shareRate:.25,saveRate:.15,followRate:.25,engRate:.10};
function scored(){
  const posted=Object.values(state.slots).filter(s=>s.status==='POSTED'&&num(s.metrics&&s.metrics.reach)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const out={};
  posted.forEach((s,i)=>{
    const r=rates(s);
    let pool=posted.slice(0,i).filter(p=>p.format===s.format).slice(-20);
    let provisional=false;
    if(pool.length<8){pool=posted.slice(0,i).slice(-20);provisional=true;}
    if(pool.length<4){out[s.id]={score:null,provisional:true,r,n:pool.length};return;}
    let lw=0,acc=0;
    for(const k in WEIGHTS){
      const v=r[k]; if(v==null||v<=0) continue;
      const med=median(pool.map(p=>rates(p)[k]).filter(x=>x!=null&&x>0));
      if(!med) continue;
      acc+=WEIGHTS[k]*Math.log2(v/med); lw+=WEIGHTS[k];
    }
    if(!lw){out[s.id]={score:null,provisional:true,r,n:pool.length};return;}
    const score=Math.max(1,Math.min(100,Math.round(50+25*(acc/lw))));
    out[s.id]={score,provisional,r,n:pool.length};
  });
  return out;
}
const scoreClass=v=>v==null?'na':v>=70?'good':v>=40?'mid':'poor';

// ---------- streak ----------
function weekStats(w){
  const slots=Object.values(state.slots).filter(s=>s.date>=w.start&&s.date<=w.end);
  const posted=slots.filter(s=>s.status==='POSTED').length;
  const filmed=slots.filter(s=>s.status==='FILMED').length;
  const skipped=slots.filter(s=>s.status==='SKIPPED');
  const reasons={}; skipped.forEach(s=>{const k=(s.skipReason||'unstated').toLowerCase();reasons[k]=(reasons[k]||0)+1;});
  return {slots,planned:slots.length,posted,filmed,skipped:skipped.length,reasons,hit:slots.length?posted/Math.max(S.postsPerWeek,slots.length):0,complete:w.end<todayISO()};
}
function streak(){
  const weeks=allWeeks().filter(w=>w.end<todayISO());
  let cur=0,best=0,run=0,brokenLast=false;
  weeks.forEach(w=>{const st=weekStats(w); if(st.posted>=S.postsPerWeek){run++;best=Math.max(best,run);}else{run=0;}});
  cur=run;
  if(weeks.length){const last=weekStats(weeks[weeks.length-1]); brokenLast=last.posted<S.postsPerWeek;}
  return {cur,best,brokenLast,completed:weeks.length};
}

// ---------- growth ----------
function pace(dateISO){
  const t0=parse(S.startDate),t1=parse(S.goalDate),t=parse(dateISO);
  const f=Math.min(1,Math.max(0,(t-t0)/(t1-t0)));
  return S.startFollowers+(S.goal-S.startFollowers)*f;
}
function growthSummary(){
  const g=state.growth.slice().sort((a,b)=>a.date<b.date?-1:1);
  const first=g[0],last=g[g.length-1];
  const weeksTotal=(parse(S.goalDate)-parse(S.startDate))/DAY/7;
  const weeksElapsed=Math.max(0,(parse(last.date)-parse(S.startDate))/DAY/7);
  const weeksLeft=Math.max(0.1,weeksTotal-weeksElapsed);
  const requiredNow=(S.goal-last.count)/weeksLeft;
  const requiredOriginal=(S.goal-S.startFollowers)/weeksTotal;
  const actualRate=weeksElapsed>=1?(last.count-S.startFollowers)/weeksElapsed:null;
  const prev=g.length>1?g[g.length-2]:null;
  const delta7=prev?last.count-prev.count:null;
  return {first,last,requiredNow,requiredOriginal,actualRate,onPace:last.count>=pace(last.date),paceNow:pace(last.date),delta7,prev};
}

  if(state.growthRange==='year'){x0=parse(S.startDate);x1=parse(S.goalDate);y0=0;y1=S.goal;}
  else{x1=new Date(Math.max(parse(todayISO()).getTime(),parse(g[g.length-1].date).getTime()));x0=new Date(x1.getTime()-8*7*DAY);const inRange=g.filter(r=>parse(r.date)>=x0);const vals=inRange.map(r=>r.count).concat([pace(iso(x0)),pace(iso(x1))]);const mn=Math.min(...vals),mx=Math.max(...vals);const padv=Math.max(40,(mx-mn)*.2);y0=Math.max(0,Math.floor((mn-padv)/50)*50);y1=Math.ceil((mx+padv)/50)*50;}
  const X=d=>L+(W-L-R)*((d-x0)/(x1-x0)),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  const ticks=5;let grid='',ylab='';
  for(let i=0;i<=ticks;i++){const v=y0+(y1-y0)*i/ticks;grid+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>`;ylab+=`<text x="${L-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${Math.round(v)>=1000?(Math.round(v)/1000).toFixed(1).replace(/\.0$/,'')+'k':Math.round(v)}</text>`;}
  const months=[];let m=new Date(x0.getFullYear(),x0.getMonth()+1,1);while(m<=x1){months.push(new Date(m));m=new Date(m.getFullYear(),m.getMonth()+1,1);}
  const xl=(state.growthRange==='year'?months.filter((_,i)=>i%2===0):months).map(d=>`<text x="${X(d).toFixed(1)}" y="${H-8}" text-anchor="middle">${d.toLocaleDateString('en-AU',{month:'short'})}</text>`).join('');
  const pts=g.filter(r=>parse(r.date)>=x0&&parse(r.date)<=x1);
  const path=pts.map((r,i)=>`${i?'L':'M'}${X(parse(r.date)).toFixed(1)},${Y(r.count).toFixed(1)}`).join(' ');
  const area=pts.length>1?path+` L${X(parse(pts[pts.length-1].date)).toFixed(1)},${Y(y0)} L${X(parse(pts[0].date)).toFixed(1)},${Y(y0)} Z`:'';
  const pace0=new Date(Math.max(x0.getTime(),parse(S.startDate).getTime())),pace1=x1;
  const paceLine=`M${X(pace0).toFixed(1)},${Y(pace(iso(pace0))).toFixed(1)} L${X(pace1).toFixed(1)},${Y(pace(iso(pace1))).toFixed(1)}`;
  const goalLine=state.growthRange==='year'?`<line class="goal" x1="${L}" x2="${W-R}" y1="${Y(S.goal)}" y2="${Y(S.goal)}"/><text x="${W-R}" y="${Y(S.goal)-4}" text-anchor="end">10,000 goal</text>`:'';
  const dots=pts.map((r,i)=>`<circle class="pt${i===pts.length-1?' last':''}" r="4" cx="${X(parse(r.date)).toFixed(1)}" cy="${Y(r.count).toFixed(1)}" data-i="${i}"><title>${fmtShort(r.date)}: ${r.count.toLocaleString()} followers, pace ${Math.round(pace(r.date)).toLocaleString()}</title></circle>`).join('');
  const lastLab=pts.length?`<text x="${Math.min(W-R-30,X(parse(pts[pts.length-1].date))+6).toFixed(1)}" y="${(Y(pts[pts.length-1].count)-8).toFixed(1)}" style="fill:var(--ink);font-weight:600">${pts[pts.length-1].count.toLocaleString()}</text>`:'';
  box.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Follower count against the 10k pace line">${grid}${ylab}${xl}${goalLine}<path class="pace" d="${paceLine}"/>${area?`<path class="area" d="${area}"/>`:''}${path?`<path class="line" d="${path}"/>`:''}${dots}${lastLab}</svg><div class="tip" id="tip"></div>`;
  const svg=box.querySelector('svg'),tip=box.querySelector('#tip');
  svg.addEventListener('pointermove',e=>{if(!pts.length)return;const rect=svg.getBoundingClientRect();const px=(e.clientX-rect.left)/rect.width*W;let best=0,bd=1e9;pts.forEach((r,i)=>{const d=Math.abs(X(parse(r.date))-px);if(d<bd){bd=d;best=i;}});const r=pts[best];tip.style.display='block';tip.style.left=(X(parse(r.date))/W*rect.width)+'px';tip.style.top=(Y(r.count)/H*rect.height)+'px';tip.textContent=`${fmtDM(r.date)} &middot; ${r.count.toLocaleString()} &middot; pace ${Math.round(pace(r.date)).toLocaleString()}`;});
  svg.addEventListener('pointerleave',()=>tip.style.display='none');
}

// ---------- HOOKS ----------
function hookTags(h){
  const t=[];const s=h.toLowerCase();
  if(/^\d|\b\d+(\.\d+)?%|\$\d|\b(seven|nine|two|three|four|five|eight|ten|thirteen|742|1,432)\b/.test(s))t.push('Number-led');
  if(/\byou|your\b/.test(s))t.push('Second person');
  if(/\?/.test(h))t.push('Question');
  if(/\. .+\./.test(h.trim())&&h.split('.').filter(x=>x.trim()).length>=2)t.push('Two-beat turn');
  if(/\b(wrong|fiction|isn't|not|never|nobody|stopped|don't|won't)\b/.test(s))t.push('Contrarian');
  if(/\b(bank|banks|rba|lender|lenders|broker)\b/.test(s))t.push('Names the counterparty');
  if(/\b(here's|here is)\b/.test(s))t.push('Promise');
  return t;
}
function renderHooks(){
  const root=document.getElementById('tab-hooks'); root.innerHTML='';
  const sc=scored();
  const rows=Object.values(state.slots).map(s=>({...s,score:(sc[s.id]||{}).score??null,prov:(sc[s.id]||{}).provisional})).sort((a,b)=>{if(a.score==null&&b.score==null)return a.date<b.date?1:-1;if(a.score==null)return 1;if(b.score==null)return -1;return b.score-a.score;});
  const tagAgg={};rows.forEach(r=>hookTags(r.hook).forEach(t=>{tagAgg[t]=tagAgg[t]||{n:0,scores:[]};tagAgg[t].n++;if(r.score!=null)tagAgg[t].scores.push(r.score);}));
  const pat=el('div','card');pat.innerHTML=`<h3>Hook patterns</h3><div class="small">Average score by pattern. Patterns repeat as winners when the number on the right stays above 50.</div><div style="margin-top:8px">${Object.entries(tagAgg).sort((a,b)=>(b[1].scores.length?b[1].scores.reduce((x,y)=>x+y,0)/b[1].scores.length:0)-(a[1].scores.length?a[1].scores.reduce((x,y)=>x+y,0)/a[1].scores.length:0)).map(([t,a])=>`<div class="bar"><div class="lab"><span class="tag">${esc(t)}</span></div><div class="track"><i style="width:${a.scores.length?Math.round(a.scores.reduce((x,y)=>x+y,0)/a.scores.length):0}%;background:var(--accent)"></i></div><div class="val num">${a.scores.length?Math.round(a.scores.reduce((x,y)=>x+y,0)/a.scores.length):'<span class="small">'+a.n+' used</span>'}</div></div>`).join('')}</div>`;
  root.appendChild(pat);
  const lib=el('div','card');lib.style.marginTop='10px';lib.innerHTML=`<h3>Every hook, best first</h3>`+rows.map(r=>`<div class="hookrow"><div><div class="h">${esc(r.hook)}</div><div class="m"><span class="chip fmt">${esc(r.format)}</span>${pillarChip(r.pillar)}<span class="tag num">${fmtDM(r.date)}</span><span class="chip ${esc(r.status)}">${esc(r.status)}</span>${hookTags(r.hook).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><div>${scoreBadge({score:r.score,provisional:r.prov})}</div></div>`).join('');
  root.appendChild(lib);
}

async function copyText(t,label){try{await navigator.clipboard.writeText(t);toast((label||'Copied')+' to clipboard');}catch(e){toast('Copy failed, long-press to select instead');}}
function slidesText(sc){return (sc.slides||[]).map((sl,i)=>`${i===0?'Cover':'Slide '+(i+1)} · ${sl[0]}\n${sl[1]}`).join('\n\n');}
let prompterEl=null,prompterSize=30;
function openPrompter(s){
  closePrompter();
  prompterEl=el('div','prompter');prompterEl.setAttribute('role','dialog');prompterEl.setAttribute('aria-label','Teleprompter');
  const paras=String(s.script.spoken||'').split(/\n\s*\n/).map(x=>`<p>${esc(x)}</p>`).join('');
  prompterEl.innerHTML=`<div class="bar"><div><div style="font-weight:700">${esc(s.title)}</div><div class="small num">${s.script.words||''} words · about ${s.script.seconds||''} sec</div></div><div style="display:flex;gap:6px"><button class="btn small" id="pMinus" aria-label="Smaller text">A&minus;</button><button class="btn small" id="pPlus" aria-label="Larger text">A+</button><button class="btn small primary" id="pClose">Close</button></div></div><div class="txt" id="pTxt" style="font-size:${prompterSize}px">${paras}</div>`;

  document.addEventListener('keydown',escClose);
}
function escClose(e){if(e.key==='Escape')closePrompter();}

  root.appendChild(bank);

  bank.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.news=newsBank().filter(x=>x.id!==b.dataset.del);renderNews();persist();});
  bank.querySelectorAll('[data-promote]').forEach(b=>b.onclick=()=>{const it=newsBank().find(x=>x.id===b.dataset.promote);if(!it)return;const w=weekFor(todayISO());const n=Object.values(state.slots).filter(s=>s.date>=w.start&&s.date<=w.end).length+1;openSheet(null,{id:`${w.id}-T${String(n).padStart(2,'0')}`,title:it.title.slice(0,80),hook:it.title,pillar:it.pillar,kind:'TOPICAL',angle:it.angle||'',notes:it.url?'Source: '+it.url:'',cta:''});it.used=true;persist();});
}
function setInsights(v){state.insightsView=v;document.querySelectorAll('#insSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));document.getElementById('tab-pillars').hidden=v!=='pillars';document.getElementById('tab-hooks').hidden=v!=='hooks';}
document.querySelectorAll('#insSeg button').forEach(b=>b.onclick=()=>setInsights(b.dataset.v));

// ---------- header ----------
function renderHeader(){
  document.getElementById('handle').textContent=S.handle;
  const g=growthSummary(); document.getElementById('followersHead').textContent=g.last.count.toLocaleString();
  const st=streak(); const e=document.getElementById('streak');
  e.className='streak '+(st.brokenLast?'broken':st.cur?'ok':'zero');
  document.getElementById('streakN').textContent=st.cur;
  document.getElementById('streakL').textContent=st.brokenLast?'streak broken':st.cur===1?'week streak':'week streak';
  const c=document.getElementById('conn'); c.className='conn '+(state.dbState==='on'?'on':state.dbState==='off'?'off':'');
  c.querySelector('span').textContent=state.dbState==='on'?'saved on this phone':state.dbState==='off'?'storage blocked, export often':'loading';
}

// ---------- sheet (edit) ----------
let sheetEl=null;
function openSheet(id,pre){
  const s=id?state.slots[id]:{id:'',date:todayISO(),time:'06:45',format:'Reel',lane:'A',pillar:1,title:'',hook:'',angle:'',kind:'EVERGREEN',cta:'',status:'PLANNED',metrics:{},...(pre||{})};
  if(!s)return;
  closeSheet();
  const m=s.metrics||{};
  sheetEl=el('div','sheet-bg');
  sheetEl.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Edit slot">
  <h3>${id?esc(s.title):'New slot'}</h3><div class="sub">${id?esc(s.id)+' &middot; '+fmtShort(s.date)+' '+esc(s.time)+' &middot; '+esc(s.format):'Adds a row to the log and the week view'}</div>
  ${id?`<div class="small" style="white-space:pre-line">${esc(s.hook)}</div>`:''}
  <div class="field"><label>Status</label><div class="statusbtns">${['PLANNED','FILMED','POSTED','SKIPPED'].map(k=>`<button class="${k}" data-s="${k}" aria-pressed="${s.status===k}">${k}</button>`).join('')}</div></div>
  <div class="field" id="skipWrap" ${s.status==='SKIPPED'?'':'hidden'}><label for="fSkip">Skip reason (one word)</label><select id="fSkip"><option value="">choose</option>${['no time','no idea','tech','deliberate'].map(r=>`<option ${s.skipReason===r?'selected':''}>${r}</option>`).join('')}</select></div>
  ${!id?`<div class="fgrid"><div class="field"><label for="nId">ID</label><input id="nId" placeholder="W3-01" value="${esc(s.id||'')}"></div><div class="field"><label for="nDate">Date</label><input id="nDate" type="date" value="${s.date}"></div><div class="field"><label for="nTime">Time</label><input id="nTime" value="${s.time}"></div><div class="field"><label for="nFormat">Format</label><select id="nFormat"><option>Reel</option><option>Carousel</option><option>Story</option></select></div><div class="field"><label for="nPillar">Pillar</label><select id="nPillar">${S.pillars.map(p=>`<option value="${p.n}" ${Number(s.pillar)===p.n?'selected':''}>${p.n} &middot; ${esc(p.short)}</option>`).join('')}</select></div><div class="field"><label for="nKind">Kind</label><select id="nKind"><option ${s.kind==='EVERGREEN'?'selected':''}>EVERGREEN</option><option ${s.kind==='TOPICAL'?'selected':''}>TOPICAL</option></select></div></div><div class="field"><label for="nTitle">Title</label><input id="nTitle" value="${esc(s.title||'')}"></div><div class="field"><label for="nHook">Hook</label><textarea id="nHook" rows="2">${esc(s.hook||'')}</textarea></div><div class="field"><label for="nAngle">Angle</label><textarea id="nAngle" rows="2">${esc(s.angle||'')}</textarea></div><div class="field"><label for="nCta">CTA</label><input id="nCta" value="${esc(s.cta||'')}"></div>`:''}
  <h2>Performance, after posting</h2>
  <div class="fgrid">${[['reach','Reach (accounts)'],['views','Views'],['likes','Likes'],['comments','Comments'],['shares','Shares'],['saves','Saves'],['profileVisits','Profile visits'],['follows','Follows'],['avgWatchPct','Avg watch %']].map(([k,l])=>`<div class="field"><label for="m_${k}">${l}</label><input id="m_${k}" type="number" inputmode="decimal" step="any" placeholder="n/a" value="${m[k]==null?'':esc(m[k])}"></div>`).join('')}</div>
  <div class="field"><label for="fPostedAt">Posted at (actual)</label><input id="fPostedAt" placeholder="e.g. 2026-09-16 12:34" value="${esc(s.postedAt||'')}"></div>
  <div class="field"><label for="fNotes">Notes</label><textarea id="fNotes" rows="2">${esc(s.notes||'')}</textarea></div>
  <div class="actions"><button class="btn" id="shCancel">Cancel</button><button class="btn primary" id="shSave">Save</button></div></div>`;
  document.body.appendChild(sheetEl);
  let status=s.status;
  sheetEl.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{status=b.dataset.s;sheetEl.querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===status));sheetEl.querySelector('#skipWrap').hidden=status!=='SKIPPED';});
  sheetEl.addEventListener('click',e=>{if(e.target===sheetEl)closeSheet();});
  sheetEl.querySelector('#shCancel').onclick=closeSheet;
  sheetEl.querySelector('#shSave').onclick=async()=>{
    const q=sel=>sheetEl.querySelector(sel);
    const metrics={};['reach','views','likes','comments','shares','saves','profileVisits','follows','avgWatchPct'].forEach(k=>{const v=num(q('#m_'+k).value);if(v!=null)metrics[k]=v;});
    let doc={...s,status,skipReason:status==='SKIPPED'?(q('#fSkip').value||'unstated'):'',metrics,postedAt:q('#fPostedAt').value.trim(),notes:q('#fNotes').value.trim(),updatedAt:new Date().toISOString()};
    if(!id){doc.id=q('#nId').value.trim();doc.date=q('#nDate').value;doc.time=q('#nTime').value.trim()||'06:45';doc.format=q('#nFormat').value;doc.lane=doc.format==='Reel'?'A':'-';doc.pillar=Number(q('#nPillar').value);doc.kind=q('#nKind').value;doc.title=q('#nTitle').value.trim();doc.hook=q('#nHook').value.trim();doc.cta=q('#nCta').value.trim();doc.angle=q('#nAngle').value.trim();doc.type='';doc.week=weekFor(doc.date).id;if(!doc.id||!doc.date||!doc.title){toast('ID, date and title needed');return;}if(!/^[A-Za-z0-9_\-.~:@+]+$/.test(doc.id)){toast('ID: letters, digits and dashes only');return;}}
    if(status==='POSTED'&&!doc.postedAt)doc.postedAt=`${doc.date} ${doc.time}`;
    await saveSlot(doc);
    closeSheet();
  };
}
function closeSheet(){if(sheetEl){sheetEl.remove();sheetEl=null;}}

// ---------- persistence (on this device) ----------
let toastT=null;
function toast(msg){let t=document.querySelector('.toast');if(!t){t=el('div','toast');document.body.appendChild(t);}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600);}
const KEY='road-to-10k-state-v1';
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('road-to-10k',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function idbGet(k){try{const d=await idb();return await new Promise((res,rej)=>{const t=d.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}catch(e){return undefined;}}
async function idbSet(k,v){try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});return true;}catch(e){return false;}}
function snapshot(){return {version:1,app:'road-to-10k',exportedAt:new Date().toISOString(),handle:S.handle,slots:state.slots,growth:state.growth,reviews:state.reviews,meta:state.meta,news:state.news||[]};}
let persistT=null;
function persist(){clearTimeout(persistT);persistT=setTimeout(async()=>{const snap=snapshot();const ok=await idbSet(KEY,snap);try{localStorage.setItem(KEY,JSON.stringify(snap));}catch(e){}state.dbState=ok?'on':'off';renderHeader();},150);}
function applySnapshot(snap,mode){
  if(!snap||typeof snap!=='object')return 0;let n=0;
  if(snap.slots&&typeof snap.slots==='object'){const arr=Array.isArray(snap.slots)?snap.slots:Object.values(snap.slots);arr.forEach(d=>{if(!d||!d.id)return;if(mode==='replace'){state.slots[d.id]=d;}else{state.slots[d.id]={...(state.slots[d.id]||{}),...d};}n++;});}
  if(Array.isArray(snap.growth)){const byDate={};state.growth.forEach(r=>byDate[r.date]=r);snap.growth.forEach(r=>{if(r&&r.date&&r.count!=null)byDate[r.date]=r;});state.growth=Object.values(byDate).sort((a,b)=>a.date<b.date?-1:1);}
  if(snap.reviews&&typeof snap.reviews==='object'){state.reviews={...state.reviews,...snap.reviews};}
  if(snap.meta&&typeof snap.meta==='object'){const m=snap.meta;state.meta={...state.meta,...m,stories:{...(state.meta.stories||{}),...(m.stories||{})}};if(Array.isArray(m.weeks)&&m.weeks.length)state.meta.weeks=m.weeks;if(Array.isArray(m.moments)&&m.moments.length)state.meta.moments=m.moments;}
  if(snap.stories&&typeof snap.stories==='object'){state.meta.stories={...(state.meta.stories||{}),...snap.stories};}
  if(Array.isArray(snap.weeks)&&snap.weeks.length)state.meta.weeks=snap.weeks;
  if(Array.isArray(snap.news)){const by={};(state.news||[]).forEach(x=>by[x.id]=x);snap.news.forEach(x=>{if(x&&x.id)by[x.id]={...(by[x.id]||{}),...x};});state.news=Object.values(by);}
  return n;
}
async function saveSlot(doc){state.slots[doc.id]=doc;renderAll();persist();toast('Saved on this phone');}
async function saveGrowth(list){state.growth=list;renderAll();persist();toast('Reading saved');}
async function connect(){
  let snap=await idbGet(KEY);
  if(!snap){try{const raw=localStorage.getItem(KEY);if(raw)snap=JSON.parse(raw);}catch(e){}}
  if(snap){applySnapshot(snap,'replace');state.dbState='on';}else{state.dbState='on';persist();}
  // built-in plan sits underneath stored data: new fields shipped with the app (scripts, angles) show up without losing statuses or numbers
  PLAN.slots.forEach(ps=>{const st=state.slots[ps.id]||{};state.slots[ps.id]={...ps,...st,script:(st.script&&(st.script.spoken||st.script.slides))?st.script:ps.script};});
  (S.retiredSlots||[]).forEach(id=>{const st=state.slots[id];if(st&&(st.status||'PLANNED')==='PLANNED'&&!st.updatedAt&&!(st.metrics&&Object.keys(st.metrics).length))delete state.slots[id];});
  renderAll();
}
function fileName(){return 'road-to-10k-export-'+todayISO()+'.json';}
async function exportData(){
  const text=JSON.stringify(snapshot(),null,1);
  const blob=new Blob([text],{type:'application/json'});
  const file=new File([blob],fileName(),{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Road to 10k export'});state.meta.lastExport=todayISO();persist();toast('Shared');return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);state.meta.lastExport=todayISO();persist();toast('Downloaded');return;}catch(e){}
  try{await navigator.clipboard.writeText(text);toast('Copied to clipboard');}catch(e){toast('Export failed');}
}
function importText(text){
  let snap;try{snap=JSON.parse(text);}catch(e){toast('That is not a valid JSON file');return;}
  if(snap.app&&snap.app!=='road-to-10k'){toast('Not a Road to 10k file');return;}
  const n=applySnapshot(snap,'merge');state.meta.lastImport=todayISO();renderAll();persist();toast(`Imported ${n} slot${n===1?'':'s'}`);
}
function openDataSheet(){
  closeSheet();
  const g=state.growth.length;const n=Object.keys(state.slots).length;
  sheetEl=el('div','sheet-bg');
  sheetEl.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Backup and sync">
  <h3>Backup and sync</h3><div class="sub">Everything lives on this phone. ${n} slots, ${g} follower readings, ${Object.keys(state.reviews).length} reviews.${state.meta.lastExport?' Last export '+fmtDM(state.meta.lastExport)+'.':''}${state.meta.lastImport?' Last import '+fmtDM(state.meta.lastImport)+'.':''}</div>
  <h2>Export</h2><div class="small">Sunday: share the file into Google Drive, Mortgage Content Machine / Instagram / sync. The weekly review reads it from there.</div>
  <div class="actions" style="justify-content:flex-start;margin-top:8px"><button class="btn primary" id="exBtn">Export data</button><button class="btn" id="copyBtn">Copy as text</button></div>
  <h2>Import</h2><div class="small">Monday: open the import file the review left in the same sync folder, or paste its contents.</div>
  <div class="field"><label for="impFile">Choose file</label><input id="impFile" type="file" accept="application/json,.json"></div>
  <div class="field"><label for="impText">Or paste JSON</label><textarea id="impText" rows="3" placeholder="{ ... }"></textarea></div>
  <div class="actions" style="justify-content:flex-start;margin-top:8px"><button class="btn primary" id="impBtn">Import pasted text</button></div>
  <h2>Danger zone</h2><div class="actions" style="justify-content:flex-start"><button class="btn" id="resetBtn" style="color:var(--bad);border-color:var(--bad)">Reset to the launch plan</button></div>
  <div class="actions"><button class="btn" id="dsClose">Close</button></div></div>`;
  document.body.appendChild(sheetEl);
  sheetEl.addEventListener('click',e=>{if(e.target===sheetEl)closeSheet();});
  sheetEl.querySelector('#dsClose').onclick=closeSheet;
  sheetEl.querySelector('#exBtn').onclick=exportData;
  sheetEl.querySelector('#copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(snapshot()));toast('Copied');}catch(e){toast('Copy failed');}};
  sheetEl.querySelector('#impFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{importText(String(r.result));closeSheet();};r.readAsText(f);};
  sheetEl.querySelector('#impBtn').onclick=()=>{const t=sheetEl.querySelector('#impText').value.trim();if(!t){toast('Nothing to import');return;}importText(t);closeSheet();};
  sheetEl.querySelector('#resetBtn').onclick=()=>{if(!confirm('Replace everything on this phone with the launch plan? Export first if you want to keep your numbers.'))return;state.slots={};PLAN.slots.forEach(s=>state.slots[s.id]={...s,status:'PLANNED',metrics:{}});state.growth=PLAN.growth.slice();state.reviews={};state.meta={};state.news=[];renderAll();persist();closeSheet();toast('Reset');};
}
document.getElementById('dataBtn').onclick=openDataSheet;

// ---------- tabs ----------
function showTab(t){state.tab=t;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));['week','log','growth','insights','news','scripts'].forEach(k=>document.getElementById('tab-'+k).hidden=(k!==t));try{localStorage.setItem('r10k-tab',t);}catch(e){}window.scrollTo({top:0});}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function renderAll(){renderHeader();renderWeek();renderLog();renderGrowth();renderPillars();renderHooks();renderScripts();renderNews();}
renderAll();
try{const t=localStorage.getItem('r10k-tab');if(t&&['week','log','growth','insights','news','scripts'].includes(t))showTab(t);}catch(e){}
connect();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
})();
</script>
