month\n\nIt isn't a trick and it isn't personal. It's the rule every lender works under.\n\nBut it's why your number came back low, and it's why a different lender's calculator can give you a different answer on identical income.\n\nSave this before your next application.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#borrowingpower #firsthomebuyer #mortgagebroker #homeloans #preapproval"}}, {"id": "C-P2-01", "group": "the-number", "groupLabel": "The Number", "pillar": 2, "format": "Carousel", "lane": "-", "type": "question", "title": "What you actually need for a $900k place", "hook": "The deposit is 20%. The number you need is not.", "angle": "Deposit plus the costs nobody budgets for.", "cta": "Save this before you start looking.", "kind": "EVERGREEN", "disclaimer": "figures", "onScreen": "The deposit on a $900,000 place is $180,000. The number you actually need is bigger.", "expires": null, "confirm": "NSW stamp duty on $900,000 and current first home buyer thresholds. Do not build this slide until confirmed.", "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "The deposit on a $900,000 place is $180,000. The number you actually need is bigger."], ["The deposit", "20% of $900,000 is $180,000. That's the part everyone knows."], ["Stamp duty", "[CONFIRM: current NSW stamp duty on a $900,000 purchase, and whether any first home buyer concession applies]. This is usually the number that breaks the plan."], ["The rest", "Legal and conveyancing. Building and pest. Lender fees. Council and water adjustments at settlement. Moving. Budget a few thousand, not a few hundred."], ["The alternative", "Under 20% you can still buy, you just pay lender's mortgage insurance. It's a one-off cost that buys you time in the market. Sometimes that's the right trade, sometimes it isn't."], ["The trap", "The deposit is a moving target. You save, the market moves, the gap doesn't close. Waiting to hit 20% has its own price."], ["Close", "Work out your real number before you fall in love with a place."]], "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "The deposit on a $900,000 place is $180,000. The number you actually need is bigger.\n\n→ deposit at 20%: $180,000\n→ stamp duty: the one that usually breaks the plan\n→ legal, building and pest, lender fees, settlement adjustments, moving\n\nUnder 20% you can still buy, you just pay lender's mortgage insurance. It's a one-off cost that buys you time in the market. Sometimes that's the right trade.\n\nThe trap nobody warns you about: the deposit is a moving target. You save, the market moves, the gap doesn't close. Waiting to hit 20% has a price too.\n\nWork out your real number before you fall in love with a place.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#deposit #firsthomebuyer #stampduty #mortgagebroker #australianproperty"}}, {"id": "C-P2-02", "group": "the-number", "groupLabel": "The Number", "pillar": 2, "format": "Carousel", "lane": "-", "type": "mechanism", "title": "Five years in on a million dollar loan", "hook": "Five years of repayments on a $1m loan. $359,730 paid. $69,000 off.", "angle": "The long version of the POV reveal, with the fix on the last slide.", "cta": "Save this and show it to whoever says an extra repayment doesn't matter.", "kind": "EVERGREEN", "disclaimer": "figures", "onScreen": "Five years of repayments on a $1m loan. $359,730 paid. About $69,000 off what you owe.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "Five years of repayments on a $1m loan. $359,730 paid. About $69,000 off what you owe."], ["The repayment", "$1,000,000 at 6%, 30 years, principal and interest. About $5,996 a month."], ["Year one", "$71,946 paid. $12,280 comes off the balance. $59,666 is interest."], ["Year five", "You've paid about $359,730. Your balance has moved about $69,000. You still owe roughly $930,000."], ["Why it's built that way", "Interest is charged on the balance. The balance barely moves early, so almost everything you pay early is interest. It flips later, but later is a long way away."], ["What actually changes it", "Money in an offset works from day one, against the highest balance you'll ever have. That's why the early years are the ones worth attacking."], ["Close", "The first five years aren't paying off a house. They're buying the right to start."]], "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "Five years of repayments on a $1m loan. $359,730 paid. About $69,000 off what you owe.\n\n$1,000,000 at 6%, 30 years, principal and interest. About $5,996 a month.\n\n→ year one: $71,946 paid, $12,280 off the balance, $59,666 interest\n→ year five: about $359,730 paid, balance down about $69,000\n\nInterest is charged on the balance. The balance barely moves early, so almost everything you pay early is interest. It flips eventually. Eventually is a long way away.\n\nWhat changes it: money sitting in an offset works from day one, against the highest balance you'll ever have. The early years are the ones worth attacking.\n\nThe first five years aren't paying off a house. They're buying the right to start.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#mortgage #offsetaccount #homeloans #mortgagebroker #thenumber"}}, {"id": "C-P2-03", "group": "the-number", "groupLabel": "The Number", "pillar": 2, "format": "Carousel", "lane": "-", "type": "mechanism", "title": "The number on your file that kills the deal", "hook": "There's a number on your file that can kill the deal before the rate matters.", "angle": "Debt to income, who it hits, and why it's a cap on the lender not on you.", "cta": "Save this. You'll want it before your next purchase.", "kind": "EVERGREEN", "disclaimer": "figures", "onScreen": "There's a number on your file that can kill the deal before the rate ever matters.", "expires": null, "confirm": "APRA DTI cap at 20% of new lending at 6x or above. Confirm still current before posting.", "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "There's a number on your file that can kill the deal before the rate ever matters."], ["It's called DTI", "Debt to income. Your total debt divided by your household income."], ["The cap", "Lenders can write no more than 20% of their new loans at six times income or more. Not a ban. A quota."], ["What counts as debt", "The new loan. Your existing loans. Credit card limits, not balances. The car. HECS. All of it."], ["The arithmetic", "Household income of $150,000 means roughly $900,000 of total debt before you're in the capped bucket."], ["Who it hits first", "Investors on property two and three. You didn't get worse. Your own portfolio started blocking you."], ["Close", "It's a cap on their book, not a no to you. Which is why the lender you apply to matters more than the rate they advertise."]], "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "There's a number on your file that can kill the deal before the rate ever matters.\n\nDebt to income. Total debt divided by household income.\n\nLenders can write no more than 20% of new loans at six times income or more. That's not a ban, it's a quota, and it fills up.\n\nWhat counts as debt: the new loan, your existing loans, credit card limits (not balances), the car, HECS.\n\nHousehold income of $150,000 means roughly $900,000 of total debt before you're in the capped bucket.\n\nWho it hits first: investors on property two and three. You didn't get worse. Your own portfolio started blocking you.\n\nIt's a cap on their book, not a no to you. Which is why who you apply to matters more than the rate they advertise.\n\nSave this. You'll want it before your next purchase.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#dti #borrowingpower #propertyinvestor #mortgagebroker #homeloans"}}, {"id": "C-P2-04", "group": "the-number", "groupLabel": "The Number", "pillar": 2, "format": "Carousel", "lane": "-", "type": "correction", "title": "Rent against repayment, side by side", "hook": "$650 a week in rent services a $470,000 loan. $750 services $542,000.", "angle": "Rent converted to loan size, then the buffer as the explanation for the gap.", "cta": "Send this to whoever told you to wait.", "kind": "EVERGREEN", "disclaimer": "figures", "onScreen": "$650 a week in rent services a $470,000 loan. $750 services $542,000.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "$650 a week in rent services a $470,000 loan. $750 services $542,000."], ["The maths", "At 6% over 30 years, principal and interest. $650 a week is about $2,817 a month. $750 a week is about $3,250 a month."], ["What that services", "$2,817 a month: about $470,000. $3,250 a month: about $542,000."], ["So why the no", "The bank doesn't test you at 6%. It tests you at your rate plus a 3% buffer. It's asking whether you could handle 9%."], ["What that costs you", "On a $1,000,000 loan: about $5,996 a month at 6%, about $8,046 at 9%. You have to clear the bigger one."], ["The honest catch", "Rent isn't the whole picture. Rates, strata, insurance and maintenance are yours now, and they're real money. Budget for them or the first year hurts."], ["Close", "You're not being told you can't afford it. You're being told you can't afford it if everything gets worse."]], "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "$650 a week in rent services a $470,000 loan. $750 a week services about $542,000.\n\nAt 6% over 30 years, principal and interest.\n\nSo why does the bank say no?\n\nIt doesn't test you at 6%. It tests you at your rate plus a 3% buffer, which means it's asking whether you could handle 9%. On a $1,000,000 loan that's about $5,996 a month against about $8,046.\n\nThe honest catch: rent isn't the whole picture. Rates, strata, insurance and maintenance are yours now, and they're real money.\n\nYou're not being told you can't afford it. You're being told you can't afford it if everything gets worse.\n\nSend this to whoever told you to wait.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#rentvsbuy #firsthomebuyer #borrowingpower #mortgagebroker #australianproperty"}}, {"id": "R-P3-01", "group": "bank-wont-say", "groupLabel": "What the bank won't say", "pillar": 3, "format": "Reel", "lane": "A", "type": "contrarian", "title": "Your bank has two rates", "hook": "Your bank has two rates. One for you, one for the person who walked in yesterday.", "angle": "Loyalty tax. The mechanism, then the exact thing to say on the phone.", "cta": "Send this to someone who hasn't called their bank in a year.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "Two rates. One for you. One for them.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 86, "seconds": 30, "spoken": "Your bank has two rates. One for you, and one for the person who walked in yesterday.\n\nThey're not going to tell you which one you're on.\n\nNew customers get the sharp number, because that's how banks win business. Existing customers get whatever they had, quietly, forever.\n\nHere's the fix. Ring your lender and ask one question. What's the best rate you'd offer me today if I were a new customer.\n\nThen sit in the silence.\n\nMost people have never asked. That's the entire business model.", "onScreen": "Two rates. One for you. One for them.", "numbers": "None. Never quote a rate or name a lender.", "disclaimerText": "General market commentary only, not advice.", "caption": "Your bank has two rates. One for you, one for the person who walked in yesterday.\n\nThey're not going to tell you which one you're on.\n\nNew customers get the sharp number, because that's how banks win business. Existing customers get whatever they had, quietly, forever.\n\nThe fix takes one phone call.\n\nRing your lender. Ask one question: what's the best rate you'd offer me today if I were a new customer?\n\nThen sit in the silence.\n\nMost people have never asked. That's the entire business model.\n\nSend this to someone who hasn't called their bank in a year.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#loyaltytax #refinance #mortgagebroker #homeloans #interestrates"}}, {"id": "R-P3-02", "group": "bank-wont-say", "groupLabel": "What the bank won't say", "pillar": 3, "format": "Reel", "lane": "A", "type": "correction", "title": "Pre-approval isn't approval", "hook": "Your pre-approval isn't an approval. It's the bank's opinion of you before it looked.", "angle": "What a pre-approval actually is, and the two kinds.", "cta": "Save this before you bid on anything.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "Two kinds of pre-approval. They look identical.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 86, "seconds": 30, "spoken": "Your pre-approval is not an approval. It's the bank's opinion of you before anybody looked properly.\n\nThere are two kinds and nobody tells you which one you've got.\n\nOne is a system check. A computer read your numbers and printed a letter. No human has opened a payslip.\n\nThe other has been assessed by a person, with your documents verified.\n\nThey look identical on paper. One survives an auction. The other doesn't.\n\nAsk which kind you have. If nobody can answer, you have the first kind.", "onScreen": "Two kinds of pre-approval. They look identical.", "numbers": "None. Describe the mechanism, never a lender.", "disclaimerText": "General market commentary only, not advice.", "caption": "Your pre-approval isn't an approval. It's the bank's opinion of you before anybody looked properly.\n\nThere are two kinds, and nobody tells you which one you've got.\n\n→ a system check. A computer read your numbers and printed a letter. No human has opened a payslip\n→ a human assessment, with documents actually verified\n\nThey look identical on paper. One survives an auction. The other doesn't.\n\nAnd neither says anything about the property. The valuation comes after you sign, and a low one can end the whole thing.\n\nAsk which kind you have. If nobody can answer, you have the first kind.\n\nSave this before you bid on anything.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#preapproval #auction #firsthomebuyer #mortgagebroker #homeloans"}}, {"id": "R-P3-03", "group": "bank-wont-say", "groupLabel": "What the bank won't say", "pillar": 3, "format": "Reel", "lane": "A", "type": "contrarian", "title": "The calculator on their website is marketing", "hook": "The borrowing calculator on your bank's website is a marketing tool, not an assessment.", "angle": "Why the online number and the real number are different by design.", "cta": "Save this before you trust a number off a website.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "It asks four questions. They assess forty.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 94, "seconds": 33, "spoken": "The borrowing calculator on your bank's website is a marketing tool. It is not an assessment.\n\nIt asks you four things. Income, a rough expense figure, your debts, your deposit.\n\nIt doesn't ask how your income is actually paid. Not the bonus, the overtime, the shares that vest in March. It doesn't apply the buffer properly. It doesn't look at your credit file.\n\nSo it gives you a big friendly number and a button.\n\nThe number you get later is the real one, and the gap between them is where people lose a deposit.", "onScreen": "It asks four questions. They assess forty.", "numbers": "None. Never name a lender or a calculator.", "disclaimerText": "General market commentary only, not advice.", "caption": "The borrowing calculator on your bank's website is a marketing tool. It isn't an assessment.\n\nIt asks about four things. Income, a rough expense figure, your debts, your deposit.\n\nIt doesn't ask how your income is actually paid. Not the bonus you're counting on, the overtime, the second job, the shares that vest in March.\n\nIt doesn't apply the buffer properly. It doesn't look at your credit file. And the living expense figure you typed in is almost certainly lower than the minimum they're required to use.\n\nSo it gives you a big friendly number and a button.\n\nThe number you get later is the real one. The gap between the two is where people lose a deposit at an auction.\n\nSave this before you trust a number off a website.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#borrowingpower #firsthomebuyer #mortgagebroker #preapproval #homeloans"}}, {"id": "R-P3-04", "group": "bank-wont-say", "groupLabel": "What the bank won't say", "pillar": 3, "format": "Reel", "lane": "A", "type": "contrarian", "title": "Nobody at your bank is paid to call you", "hook": "Nobody at your bank gets paid to ring and tell you you're on a bad rate.", "angle": "The incentive structure, said plainly, without naming anyone.", "cta": "Set a reminder. Six months. Ring them.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "Nobody's KPI is your rate.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 91, "seconds": 32, "spoken": "Nobody at your bank is paid to ring you and say you're on a bad rate.\n\nThink about whose job that would be. The branch is measured on new business. The call centre is measured on getting you off the phone. Retention only exists once you've threatened to leave.\n\nThere's no role in that building whose performance review includes making sure you pay as little as possible.\n\nThat's not a scandal. It's how it's built. But it means the only person here with a reason to check your rate is you.", "onScreen": "Nobody's KPI is your rate.", "numbers": "None. No lender named, no conduct allegation.", "disclaimerText": "General market commentary only, not advice.", "caption": "Nobody at your bank is paid to ring you and say you're on a bad rate.\n\nThink about whose job that would be.\n\n→ the branch is measured on new business\n→ the call centre is measured on getting you off the phone\n→ retention only exists once you've threatened to leave\n\nThere's no role in that building whose performance review includes making sure you pay as little as possible.\n\nThat's not a scandal, it's just how it's built. Most businesses are.\n\nBut it means the only person here with a reason to check your rate is you.\n\nSix months. Diary it. Ring them.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#loyaltytax #refinance #homeloans #mortgagebroker #moneytips"}}, {"id": "C-P3-01", "group": "bank-wont-say", "groupLabel": "What the bank won't say", "pillar": 3, "format": "Carousel", "lane": "-", "type": "contrarian", "title": "The lender your bank hopes you never hear about", "hook": "Your bank will never tell you there are 30 other places to get the loan.", "angle": "A no from one lender is one lender's opinion.", "cta": "Save this if a bank has said no to you this year.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "Your bank will never tell you there are 30 other places to get the loan.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "Your bank will never tell you there are 30 other places to get the loan."], ["What a no actually is", "One lender's policy, applied to your file, on that day. It isn't a credit score. It isn't a verdict on you."], ["Why it happens", "Every lender writes its own rules on income, employment type, deposit, debts and property type. The same file gets different answers."], ["Who you've never heard of", "There are lenders who never advertise, because they don't need a branch network or a footy sponsorship to find borrowers."], ["The comparison people get wrong", "It isn't rate A versus rate B. It's getting in versus not getting in. Missing 12 to 24 months of the market costs more than a modest rate gap."], ["The trade-off", "Non-bank lenders can reprice faster and some have fewer features. That's a real cost and you should know it before you sign, not after."], ["Close", "One no is one opinion. Most people treat it as the last word."]], "disclaimerText": "General market commentary only, not advice.", "caption": "Your bank will never tell you there are 30 other places to get the loan.\n\nA no isn't a credit score and it isn't a verdict on you. It's one lender's policy, applied to your file, on that day.\n\nEvery lender writes its own rules on income, employment type, deposit, debts and property type. The same file gets different answers.\n\nThe comparison most people get wrong: it isn't rate A versus rate B. It's getting in versus not getting in. Missing 12 to 24 months of the market costs more than a modest rate gap.\n\nThe honest trade-off: some lenders reprice faster and some have fewer features. Know that before you sign, not after.\n\nOne no is one opinion. Most people treat it as the last word.\n\nSave this if a bank has said no to you this year.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#homeloandeclined #mortgagebroker #nonbanklender #firsthomebuyer #borrowingpower"}}, {"id": "C-P3-02", "group": "bank-wont-say", "groupLabel": "What the bank won't say", "pillar": 3, "format": "Carousel", "lane": "-", "type": "contrarian", "title": "Loyalty tax, in six slides", "hook": "You've been with your bank nine years. That's costing you, not saving you.", "angle": "What loyalty tax is, why it exists, and the script to end it.", "cta": "Send this to someone who's been with the same bank since uni.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "You've been with your bank nine years. That's costing you, not saving you.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "You've been with your bank nine years. That's costing you, not saving you."], ["The set up", "Banks compete hard for new borrowers and not at all for existing ones. Winning you costs money. Keeping you doesn't."], ["What happens over time", "Your rate sits where it is. The rate offered to new customers moves. The gap opens slowly enough that you never notice it."], ["Why you don't notice", "Your repayment doesn't change when the market does. Nothing arrives in the post. There's no moment where anyone tells you."], ["The phone call", "Ring them. Ask one question: what is the best rate you would offer me today if I walked in as a new customer? Then stop talking."], ["The trade-off", "A reprice rarely matches what a full refinance gets you. But it costs nothing, takes ten minutes, and you keep your account."], ["Close", "Nine years of loyalty bought you nothing. One phone call might."]], "disclaimerText": "General market commentary only, not advice.", "caption": "You've been with your bank nine years. That's costing you, not saving you.\n\nBanks compete hard for new borrowers and not at all for existing ones. Winning you costs money. Keeping you doesn't.\n\nSo your rate sits where it is while the new customer rate moves. The gap opens slowly enough that you never notice, because your repayment doesn't change when the market does and nothing arrives in the post.\n\nThe phone call: ring them, ask what's the best rate you'd offer me today if I walked in as a new customer, then stop talking.\n\nThe trade-off: a reprice rarely matches a full refinance. But it costs nothing and takes ten minutes.\n\nNine years of loyalty bought you nothing. One phone call might.\n\nSend this to someone who's been with the same bank since uni.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#loyaltytax #refinance #homeloans #mortgagebroker #moneytips"}}, {"id": "C-P3-03", "group": "bank-wont-say", "groupLabel": "What the bank won't say", "pillar": 3, "format": "Carousel", "lane": "-", "type": "mechanism", "title": "Things on your file you've never thought about", "hook": "Someone at the bank read a payslip and worked out something nobody had told them.", "angle": "What an assessor actually reads. The payslip tax line is the hook.", "cta": "Save this before your next application.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "Someone at a bank read a payslip and worked out something the client never told them.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "Someone at a bank read a payslip and worked out something the client never told them."], ["The tax line", "The tax coming out looked higher than it should for that salary. So they asked: do you have a HECS debt? Nobody had mentioned it."], ["Your transaction account", "Not to judge your coffee. They're looking for regular payments that look like a commitment you didn't declare. Buy now pay later shows up here."], ["Credit card limits", "Assessed on the limit, not the balance. A card you never use with a $20,000 limit is a $20,000 problem."], ["Employment type", "Permanent, probation, part time with contracted hours, casual with twelve months of history. Four different answers from the same job."], ["Every enquiry on your file", "Each application leaves a mark. Five in three months reads as desperation, whether or not that's what it was."], ["Close", "They're not trying to catch you out. They're trying to answer one question: does this add up. Make it easy to answer yes."]], "disclaimerText": "General market commentary only, not advice.", "caption": "Someone at a bank read a payslip and worked out something the client never told them.\n\nThe tax coming out looked higher than it should for that salary. So they asked: do you have a HECS debt?\n\nThat's the level of read. Here's what else gets looked at:\n\n→ your transaction account, for regular payments that look like an undeclared commitment. Buy now pay later shows up here\n→ credit card limits, not balances. An unused card with a $20,000 limit is a $20,000 problem\n→ employment type. Permanent, probation, part time with contracted hours, casual with history. Four different answers from the same job\n→ every credit enquiry. Five applications in three months reads as desperation, whether it was or not\n\nThey're not trying to catch you out. They're answering one question: does this add up.\n\nMake it easy to answer yes.\n\nSave this before your next application.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#homeloans #preapproval #borrowingpower #mortgagebroker #firsthomebuyer"}}, {"id": "C-P3-04", "group": "bank-wont-say", "groupLabel": "What the bank won't say", "pillar": 3, "format": "Carousel", "lane": "-", "type": "correction", "title": "Why your fixed rate moved before the RBA did", "hook": "Your lender changed its fixed rates and the RBA hasn't met. That's not a mistake.", "angle": "Fixed rates are priced off expectations. The mechanism, no lender named.", "cta": "Comment FIXED and I'll run your numbers.", "kind": "EVERGREEN", "disclaimer": "figures", "onScreen": "Your lender changed its fixed rates and the RBA hasn't met. That's not a mistake.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "Your lender changed its fixed rates and the RBA hasn't met. That's not a mistake."], ["The wrong model", "Most people think fixed rates follow the cash rate. They don't. Variable rates track the cash rate. Fixed rates don't."], ["What they actually follow", "What the market thinks the RBA will do over the next one to five years. That view changes daily, on inflation data, jobs numbers, and what happens overseas."], ["So", "By the time a decision is announced, fixed rates have usually already moved. You're not getting ahead of anything by fixing the day before."], ["What fixing really is", "Buying certainty. It is not a bet you win if rates rise. It's insurance, and insurance has a premium."], ["The catch", "Most fixed loans take away your offset and cap your extra repayments. If you might sell, refinance or pay it down hard, that costs more than the rate difference."], ["Close", "Fix because you can't handle a rise. Not because you think you've timed it."]], "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "Your lender changed its fixed rates and the RBA hasn't met. That's not a mistake.\n\nMost people think fixed rates follow the cash rate. They don't.\n\nVariable rates track the cash rate. Fixed rates track what the market thinks the RBA will do over the next one to five years, and that view changes daily on inflation data, jobs numbers and what's happening overseas.\n\nWhich means by the time a decision is announced, fixed rates have usually already moved. You're not getting ahead of anything by fixing the day before.\n\nFixing isn't a bet you win if rates rise. It's insurance, and insurance has a premium.\n\nThe catch: most fixed loans take your offset away and cap your extra repayments.\n\nFix because you can't handle a rise. Not because you think you've timed it.\n\nComment FIXED and I'll run your numbers.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#fixedrates #rba #interestrates #mortgagebroker #homeloans"}}, {"id": "R-P4-01", "group": "deal-breakdowns", "groupLabel": "Deal breakdowns", "pillar": 4, "format": "Reel", "lane": "B", "type": "process", "title": "Four things the bank wanted after it said yes", "hook": "The bank approved it. Then it sent a list of four more things.", "angle": "Conditional approval is not approval. Real file, de-identified.", "cta": "Save this before your next pre-approval.", "kind": "EVERGREEN", "disclaimer": "deal", "onScreen": "CONDITIONALLY APPROVED / 1 accountant's letter / 2 contracted hours / 3 do you have HECS / 4 fixed price contract", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk plus second angle 30 to 40 degrees off", "words": 186, "seconds": 65, "spoken": "The bank said yes last week. Then it sent a list of four more things it wanted.\n\nThis is a real file. Three loans, two refinances and a construction facility. Conditionally approved.\n\nHere's what conditionally approved actually means.\n\nOne. They own a company that hasn't traded in years. The bank wants a letter from the accountant confirming it's not trading and owes nothing.\n\nTwo. Her employer has to confirm her minimum contracted hours. Not what she earns. How many hours she's contracted to.\n\nThree, and this is the one. Someone at the bank looked at her payslip, saw the tax coming out looked higher than it should for that salary, and asked whether she has a HECS debt. They weren't told. They worked it out from one line on a payslip.\n\nFour. The builder's fixed price contract, with progress payments set out the lender's way, not the builder's.\n\nNone of this is unusual. All of it takes days if you find out late, and days matter when you have a finance clause.\n\nConditional approval isn't approval. It's the bank telling you what it's still worried about.", "onScreen": "CONDITIONALLY APPROVED / 1 accountant's letter / 2 contracted hours / 3 do you have HECS / 4 fixed price contract", "numbers": "None. No lender, no names, no dollar figures.", "disclaimerText": "De-identified from a real file. General market commentary only, not advice.", "caption": "The bank approved it. Then it sent a list of four more things it wanted.\n\nReal file, de-identified. Three loans, two refinances and a construction facility, conditionally approved.\n\nWhat conditional actually meant:\n→ a letter from the accountant confirming a dormant company owes nothing\n→ an employer letter confirming minimum contracted hours, not salary\n→ confirmation of a HECS debt, because someone looked at a payslip and thought the tax line looked too high for that salary\n→ the builder's fixed price contract with progress payments set out to the lender's schedule\n\nRead the third one again. Nobody told them about the HECS. They worked it out from one line on a payslip.\n\nNone of it is unusual. All of it takes days if you find out late, and days matter when you have a finance clause.\n\nConditional approval isn't approval. It's the bank telling you what it's still worried about.\n\nSave this before your next pre-approval.\n\n*De-identified from a real file. General market commentary only, not advice.* [credit rep line]\n\n#conditionalapproval #mortgagebroker #homeloans #constructionloan #firsthomebuyer"}}, {"id": "R-P4-02", "group": "deal-breakdowns", "groupLabel": "Deal breakdowns", "pillar": 4, "format": "Reel", "lane": "B", "type": "mechanism", "title": "Your accountant may have cost you a house", "hook": "Your accountant saved you tax. It might have cost you a house.", "angle": "Self employed income, minimisation, and add-backs. The single biggest lever.", "cta": "Send this to your accountant. Seriously.", "kind": "EVERGREEN", "disclaimer": "figures", "onScreen": "Taxable income down. Borrowing power down with it.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk plus second angle 30 to 40 degrees off", "words": 163, "seconds": 57, "spoken": "Your accountant saved you tax. It might have cost you a house.\n\nHere's how that happens without anyone doing anything wrong.\n\nYou're self employed. Your accountant's job is to get your taxable income down, so they do. Every year, properly and legally, exactly as you asked.\n\nThen you apply for a loan, and the bank assesses you on exactly one thing. The taxable income on your returns.\n\nSo the guy on a PAYG salary of $120,000 borrows more than you, on triple the turnover.\n\nThe lever nobody tells you about is add-backs. Depreciation, one-off purchases, interest on debt you're refinancing, sometimes retained profits. Money that left the tax return but never left the business.\n\nIf your accountant and your broker have never spoken, you're leaving that on the table.\n\nAnd the fix has a deadline. It's a conversation before your returns are lodged, not after. Once they're lodged the bank reads what's on them, and you're waiting another year for a different answer.", "onScreen": "Taxable income down. Borrowing power down with it.", "numbers": "None. Illustrative only.", "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "Your accountant saved you tax. It might have cost you a house.\n\nNobody did anything wrong. That's what makes it hurt.\n\nYou're self employed. Your accountant's job is to get taxable income down, so they do, properly and legally, every year.\n\nThen you apply for a loan and the bank assesses you on exactly one thing. The taxable income on your returns.\n\nSo your mate on a $120,000 salary borrows more than you, on triple the turnover.\n\nThe lever nobody mentions is add-backs. Depreciation. One-off purchases. Interest on debt you're refinancing. Sometimes retained profits. Money that left the tax return but never left the business.\n\nIf your accountant and your broker have never spoken, you're leaving it on the table.\n\nThe fix is a conversation before your returns are lodged, not after.\n\nSend this to your accountant. Seriously.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#selfemployed #businessowner #addbacks #mortgagebroker #borrowingpower"}}, {"id": "R-P4-03", "group": "deal-breakdowns", "groupLabel": "Deal breakdowns", "pillar": 4, "format": "Reel", "lane": "A", "type": "process", "title": "The company you forgot about", "hook": "A business you closed years ago can still hold up a loan you're applying for today.", "angle": "Dormant entities on a file. Small thing, real delay.", "cta": "Save this if you've ever had an ABN.", "kind": "EVERGREEN", "disclaimer": "deal", "onScreen": "A dormant company is still a question mark.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 90, "seconds": 32, "spoken": "A business you closed years ago can hold up a loan you're applying for today.\n\nReal file. Three loans, everything stacks up, conditionally approved. Then a condition lands.\n\nThere's a company registered in their name that hasn't traded in years. The bank wants written confirmation of what it is. Still trading, not trading, no outstanding liabilities.\n\nFair enough, from their side. A company can owe money. Until someone says otherwise in writing, it's an unknown.\n\nIt's one letter from an accountant. It's also a week, if you find out late.", "onScreen": "A dormant company is still a question mark.", "numbers": "None. No names, no lender.", "disclaimerText": "De-identified from a real file. General market commentary only, not advice.", "caption": "A business you closed years ago can hold up a loan you're applying for today.\n\nReal file, de-identified. Three loans, everything stacks up, conditionally approved. Then one condition lands.\n\nThere's a company registered in their name that hasn't traded in years. The bank wants written confirmation: still trading, not trading, no outstanding liabilities.\n\nFrom the bank's side it's fair. A company can owe money. A company can have a director's guarantee behind it. Until someone says otherwise in writing, it's an unknown, and banks don't lend against unknowns.\n\nThe fix is one letter from an accountant.\n\nIt's also a week, if you find out at the wrong moment and your accountant is on leave.\n\nIf you've ever had an ABN or a company, deal with it before you apply, not after.\n\n*De-identified from a real file. General market commentary only, not advice.* [credit rep line]\n\n#selfemployed #businessowner #homeloans #mortgagebroker #conditionalapproval"}}, {"id": "R-P4-04", "group": "deal-breakdowns", "groupLabel": "Deal breakdowns", "pillar": 4, "format": "Reel", "lane": "B", "type": "mechanism", "title": "Where the third property dies", "hook": "Property one and two were easy. Property three is where most investors stop.", "angle": "The servicing ceiling. Shading, assessment rates, and why it's structure not income.", "cta": "Comment THREE if you're stuck on your next one.", "kind": "EVERGREEN", "disclaimer": "figures", "onScreen": "Rent shaded to 70-80%. Your loans assessed 3% higher. That's the ceiling.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk plus second angle 30 to 40 degrees off", "words": 168, "seconds": 59, "spoken": "Property one was easy. Property two was fine. Property three is where most people stop, and nobody warned them it was coming.\n\nHere's what changes.\n\nYour rental income gets shaded. The bank counts 70 to 80 cents of every rent dollar, because of vacancy and costs. So on paper, every property you own costs you more than it does in real life.\n\nThen your existing loans get assessed at about 3% above what you're actually paying. Your own portfolio is now the thing blocking you.\n\nAdd a debt to income cap on top and the maths stops working while your bank statements look fine.\n\nAlmost everyone in this position thinks the answer is to earn more.\n\nIt usually isn't. What actually moves it is which lender you go to, because the shading and the assessment rates are not the same everywhere. Whether your loans are tangled together or kept separate. And whether anybody has looked at the whole portfolio at once, instead of one application at a time.", "onScreen": "Rent shaded to 70-80%. Your loans assessed 3% higher. That's the ceiling.", "numbers": "Rental shading of 70 to 80% and an assessment rate around 3% above actual are standard across lenders and vary by lender. Illustrative, no lender named.", "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "Property one was easy. Property two was fine. Property three is where most investors stop, and nobody warned them.\n\nWhat changes:\n→ your rental income gets shaded. The bank counts 70 to 80 cents in the dollar for vacancy and costs, so on paper every property costs you more than it really does\n→ your existing loans get assessed at roughly 3% above what you actually pay. Your own portfolio becomes the thing blocking you\n→ a debt to income cap sits over the top of both\n\nThe maths stops working while your bank statements look completely fine.\n\nAlmost everyone here thinks the answer is to earn more.\n\nIt usually isn't. It's structure, and which lender the file lands with.\n\nComment THREE if you're stuck on your next one.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#propertyinvestor #rentvesting #borrowingpower #mortgagebroker #servicing"}}, {"id": "C-P4-01", "group": "deal-breakdowns", "groupLabel": "Deal breakdowns", "pillar": 4, "format": "Carousel", "lane": "-", "type": "process", "title": "Your broker and your accountant should disagree in front of you", "hook": "The best financial advice I've seen this year came from two people disagreeing on email.", "angle": "How a real decision actually got made, with the client in the thread.", "cta": "Tag your accountant. Get us in the same email.", "kind": "EVERGREEN", "disclaimer": "tax", "onScreen": "The best call I've seen a client make this year came from two professionals disagreeing on email in front of her.", "expires": null, "confirm": "Client would recognise this. Get a yes from her before posting, or blur the detail further.", "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "The best call I've seen a client make this year came from two professionals disagreeing on email in front of her."], ["The situation", "Selling an investment property. A pile of loans across two lenders. One question: pay a loan off with the proceeds, or keep it?"], ["My instinct", "Keep the flexibility. Restructure so the borrowing capacity stays available for whatever comes next."], ["Her accountant's view", "Paying down that debt is a guaranteed return equal to the interest rate. Unless the money can earn more somewhere else, clearing it is the simplest, lowest risk thing to do."], ["Why that mattered", "He was right about the question. It was never pay or don't pay. It was what else would this money do."], ["What she chose", "Clear the loans, then set up separate borrowing later against another property when she's back and has time to do it properly. Her call, made with both views in front of her."], ["Close", "If your broker and your accountant have never been in the same email, you're getting two halves of an answer."]], "disclaimerText": "Anything to do with tax or structuring is your accountant's call, not mine. General market commentary only, not advice.", "caption": "The best call I've seen a client make this year came from two professionals disagreeing on email in front of her.\n\nShe was selling an investment property. Several loans across two lenders. One question: use the proceeds to pay a loan off, or keep it?\n\nMy instinct was keep the flexibility and restructure.\n\nHer accountant's view: paying down that debt is a guaranteed return equal to the interest rate. Unless the money can earn more somewhere else, clearing it is the simplest, lowest risk option.\n\nHe was right about the question. It was never pay or don't pay. It was what else would this money do.\n\nShe chose to clear the loans and set up separate borrowing later, when she's back and has time to do it properly. Her call, made with both views in front of her.\n\nIf your broker and your accountant have never been in the same email, you're getting two halves of an answer.\n\n*Anything to do with tax or structuring is your accountant's call, not mine. General market commentary only, not advice.* [credit rep line]\n\n#propertyinvestor #accountant #mortgagebroker #financialplanning #rentvesting"}}, {"id": "C-P4-02", "group": "deal-breakdowns", "groupLabel": "Deal breakdowns", "pillar": 4, "format": "Carousel", "lane": "-", "type": "process", "title": "Buying 1,000km from where you live", "hook": "They bought an investment property they have never stood in. Here's how that works.", "angle": "Interstate investing, what changes and what doesn't.", "cta": "Comment MAP if you're looking interstate.", "kind": "EVERGREEN", "disclaimer": "tax", "onScreen": "They bought an investment property they've never stood in, 1,000km from where they live.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "They bought an investment property they've never stood in, 1,000km from where they live."], ["Why", "They live where they want to live. They invest where the numbers work. Those are allowed to be two different places."], ["What changes for the lender", "Less than you'd think. The loan is assessed on your income and the property's rent, not on your postcode."], ["What actually changes", "You cannot drive past it. You're relying on a property manager, a building and pest report, and someone you trust on the ground."], ["The structure question", "They went interest only for a set period. That's a cashflow decision with a real cost: you're not reducing the balance, and the repayment jumps when it ends."], ["The trade-off", "Interstate means different stamp duty, different land tax, different tenancy law. You need an accountant who knows both states before you sign, not after."], ["Close", "You don't have to love the suburb. You have to understand the numbers and trust the people managing it."]], "disclaimerText": "Anything to do with tax or structuring is your accountant's call, not mine. General market commentary only, not advice.", "caption": "They bought an investment property they've never stood in, 1,000km from where they live.\n\nThey live where they want to live. They invest where the numbers work. Those are allowed to be two different places.\n\nWhat changes for the lender: less than you'd think. The loan is assessed on your income and the property's rent, not your postcode.\n\nWhat actually changes: you can't drive past it. You're relying on a property manager, a building and pest report, and someone on the ground you trust.\n\nThey went interest only for a set period. That's a cashflow decision with a real cost. You're not reducing the balance, and the repayment jumps when it ends.\n\nThe trade-off: different state means different stamp duty, land tax and tenancy law. Get an accountant who knows both states before you sign.\n\nYou don't have to love the suburb. You have to understand the numbers and trust the people managing it.\n\n*Anything to do with tax or structuring is your accountant's call, not mine. General market commentary only, not advice.* [credit rep line]\n\n#propertyinvestor #rentvesting #interstateinvesting #mortgagebroker #australianproperty"}}, {"id": "C-P4-03", "group": "deal-breakdowns", "groupLabel": "Deal breakdowns", "pillar": 4, "format": "Carousel", "lane": "-", "type": "process", "title": "The document that delays the most settlements", "hook": "The single most common reason a settlement slips has nothing to do with the bank.", "angle": "Insurance naming the lender. Small, boring, and it stops settlements.", "cta": "Save this if you're settling in the next 60 days.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "The most common reason a settlement slips has nothing to do with the bank's decision.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "The most common reason a settlement slips has nothing to do with the bank's decision."], ["It's the insurance certificate", "Before settlement, your lender needs a building insurance policy that names them as an interested party. Not a quote. Not a screenshot. The certificate."], ["Why they want it", "They're about to hand over a large sum secured by a building. If it burns down uninsured, they own a fire-damaged block of land."], ["Why it goes wrong", "People buy the policy and forget the lender has to be listed on it. Or the sum insured is too low. Or the start date is after settlement."], ["The other classic", "A wrong digit in a bank account number. Surplus funds bounce, and everyone waits while it's traced."], ["What to do", "Get the policy the day you get loan documents. Send the certificate straight through. Check the lender's name and the start date yourself."], ["Close", "Nobody loses a settlement over the loan. They lose it over a PDF."]], "disclaimerText": "General market commentary only, not advice.", "caption": "The most common reason a settlement slips has nothing to do with the bank's decision.\n\nIt's the insurance certificate.\n\nBefore settlement your lender needs a building insurance policy naming them as an interested party. Not a quote. Not a screenshot of the app. The certificate.\n\nFair enough, from their side. They're handing over a large sum secured by a building.\n\nWhy it goes wrong:\n→ the policy is bought but the lender isn't listed on it\n→ the sum insured is too low\n→ the start date is after settlement\n\nThe other classic: one wrong digit in a bank account number, and surplus funds bounce while everyone waits.\n\nGet the policy the day loan documents arrive. Send the certificate straight through. Check the lender's name and the start date yourself.\n\nNobody loses a settlement over the loan. They lose it over a PDF.\n\nSave this if you're settling in the next 60 days.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#settlement #homeloans #mortgagebroker #firsthomebuyer #propertysettlement"}}, {"id": "C-P4-04", "group": "deal-breakdowns", "groupLabel": "Deal breakdowns", "pillar": 4, "format": "Carousel", "lane": "-", "type": "process", "title": "Approved, then approved again for more", "hook": "The approval came through. Then the number changed. Here's what that actually costs.", "angle": "What going back to the lender mid-deal really involves.", "cta": "Save this if your budget is still moving.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "The approval came through. Then the number needed to change. Here's what that actually costs.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "The approval came through. Then the number needed to change. Here's what that actually costs."], ["What happened", "Formally approved. Then the required amount went up, so the file went back to the lender for a higher figure."], ["It's not a re-application", "The assessment already exists. It's a variation. But it goes back into a queue, and the queue doesn't care that you were approved yesterday."], ["What gets re-checked", "Servicing at the new amount. The valuation against the new LVR. Sometimes the lender's mortgage insurance position, which can change the cost."], ["What it costs", "Days, mostly. New loan documents get issued, which means signing again, which means the settlement date moves if it was tight."], ["How to avoid it", "Get approved for the number you might actually need, not the number you hope to pay. Room at the top is free. Going back for it isn't."], ["Close", "Being approved isn't the end of the process. It's the start of a different one."]], "disclaimerText": "General market commentary only, not advice.", "caption": "The approval came through. Then the number needed to change.\n\nFormally approved, then the required amount went up, so the file went back to the lender for a higher figure.\n\nIt isn't a re-application. The assessment already exists, so it's a variation. But it goes back into a queue, and the queue doesn't care you were approved yesterday.\n\nWhat gets looked at again:\n→ servicing at the new amount\n→ the valuation against the new LVR\n→ sometimes the lender's mortgage insurance position, which can change what it costs\n\nWhat it costs is days. New loan documents get issued, you sign again, and a tight settlement date moves.\n\nHow to avoid it: get approved for the number you might actually need, not the number you hope to pay. Room at the top is free. Going back for it isn't.\n\nBeing approved isn't the end of the process. It's the start of a different one.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#homeloans #preapproval #mortgagebroker #settlement #firsthomebuyer"}}, {"id": "R-P5-01", "group": "the-journey", "groupLabel": "My journey as a broker", "pillar": 5, "format": "Reel", "lane": "A", "type": "process", "title": "I missed my own batch day", "hook": "Week one of building this in public and I missed my own filming day.", "angle": "The miss, owned, in week one rather than week forty.", "cta": "Follow to watch it happen, or watch it fail.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "Week 1: 6 of 8. Said out loud.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 85, "seconds": 30, "spoken": "Week one of taking this account to 10,000 followers in public, and I missed my own filming day.\n\nThe whole system runs on one sitting a week. Eight posts, one Wednesday, ninety minutes. Wednesday came, client files came first, and the filming didn't happen.\n\nSo week one is six out of eight.\n\nI'm telling you now, in week one, rather than quietly fixing it and only posting the weeks that went well.\n\nAn account that only shows you the wins isn't building anything in public.", "onScreen": "Week 1: 6 of 8. Said out loud.", "numbers": "None.", "disclaimerText": "General market commentary only, not advice.", "caption": "Week one of taking this account to 10,000 followers in public, and I missed my own filming day.\n\nThe whole system runs on one sitting a week. Eight posts, one Wednesday, ninety minutes. Wednesday came, client files came first, and the filming didn't happen.\n\nSo week one is six out of eight.\n\nI'm telling you in week one rather than quietly fixing it and only posting the weeks that went well.\n\nAn account that builds in public and only shows the wins isn't building anything in public. It's marketing with a nicer name.\n\nSix of eight. Next week is eight.\n\nFollow to watch it happen, or watch it fail.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#buildinpublic #mortgagebroker #contentcreator #smallbusiness #sydney"}}, {"id": "R-P5-02", "group": "the-journey", "groupLabel": "My journey as a broker", "pillar": 5, "format": "Reel", "lane": "A", "type": "process", "title": "Eight posts in ninety minutes", "hook": "I film a week of content in one sitting. Here's the whole system.", "angle": "The batch process, honestly, including the rule that makes it possible.", "cta": "Ask me anything about the setup in the comments.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "8 posts. 90 minutes. Two takes max.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 91, "seconds": 32, "spoken": "I film a week of content in one sitting. Eight posts, ninety minutes, one Wednesday.\n\nThe scripts are written before I sit down. Working out what to say with the camera on costs you the morning.\n\nThree shirts on the back of the chair, changed between blocks.\n\nPhone on a tripod at the desk. No lighting rig, no microphone worth mentioning.\n\nAnd the rule that makes it work: two takes maximum. If take two isn't right, change one word and move on.\n\nPerfect is why most people post twice and stop.", "onScreen": "8 posts. 90 minutes. Two takes max.", "numbers": "None.", "disclaimerText": "General market commentary only, not advice.", "caption": "I film a week of content in one sitting. Eight posts, about ninety minutes, one Wednesday.\n\nThe whole system:\n→ scripts written before I sit down. Working out what to say with the camera on costs you the morning\n→ three shirts on the back of the chair, changed between blocks, so it doesn't look like one video cut into eight\n→ phone on a tripod at the desk. No lighting rig, no microphone worth mentioning\n→ two takes maximum. If take two isn't right, change one word and move on\n\nThat last one is the whole thing. Perfect is why most people post twice and stop.\n\nTwo takes and a shot list is why I can post eight.\n\nAsk me anything about the setup in the comments.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#contentcreator #buildinpublic #mortgagebroker #batching #smallbusiness"}}, {"id": "R-P5-03", "group": "the-journey", "groupLabel": "My journey as a broker", "pillar": 5, "format": "Reel", "lane": "A", "type": "process", "title": "The part of this job nobody sees", "hook": "Settlement day, and the thing that nearly held it up was a typo.", "angle": "The unglamorous reality of the job. Builds trust without selling anything.", "cta": "Follow for the version of this job nobody advertises.", "kind": "EVERGREEN", "disclaimer": "deal", "onScreen": "One wrong digit. Half a day.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 89, "seconds": 31, "spoken": "Everyone thinks this job is finding you a rate.\n\nHere's what a real day looks like. A settlement went through and the surplus couldn't land, because the account number we'd been given had one digit wrong. Three emails, two calls, most of an afternoon, to fix one character.\n\nAnother file needed a letter about a company that hasn't traded since 2019.\n\nAnother needed an employer to confirm contracted hours in writing.\n\nNone of it involves a rate. All of it is the difference between settling on time and not.", "onScreen": "One wrong digit. Half a day.", "numbers": "None. No names, no lender.", "disclaimerText": "De-identified from a real file. General market commentary only, not advice.", "caption": "Everyone thinks this job is finding you a rate.\n\nHere's what a real day looks like.\n\nA settlement went through and the surplus couldn't land, because the account number we'd been given had one digit wrong. Three emails, two phone calls, most of an afternoon, to fix one character.\n\nAnother file needed a letter from an accountant about a company that hasn't traded since 2019.\n\nAnother needed an employer to confirm contracted hours in writing, which sounds like a five minute job until you're waiting on an HR inbox.\n\nNone of it is on the website. None of it involves a rate.\n\nBut it's most of the job, and it's the difference between settling on time and not.\n\nFollow for the version of this job nobody advertises.\n\n*De-identified from a real file. General market commentary only, not advice.* [credit rep line]\n\n#mortgagebroker #dayinthelife #settlement #buildinpublic #smallbusiness"}}, {"id": "R-P5-04", "group": "the-journey", "groupLabel": "My journey as a broker", "pillar": 5, "format": "Reel", "lane": "A", "type": "contrarian", "title": "Why I stopped explaining the basics", "hook": "I stopped making content explaining what a mortgage is. Here's why.", "angle": "A positioning post. Says who this account is for by saying who it isn't.", "cta": "Follow if you already know the basics and nobody's helping you past them.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "The bit after the basics.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 88, "seconds": 31, "spoken": "I stopped making content that explains what a mortgage is.\n\nThere are ten thousand accounts doing that, and the people who need it aren't the people I work with.\n\nThe people I work with are on good money, did everything they were told to do, and got a number back that didn't make sense. They've read the basics four times at eleven at night.\n\nWhat nobody has explained is why their number came back 30% below what they needed.\n\nThat's the gap. So that's all this account does.", "onScreen": "The bit after the basics.", "numbers": "None.", "disclaimerText": "General market commentary only, not advice.", "caption": "I stopped making content that explains what a mortgage is.\n\nThere are ten thousand accounts doing that, and the people who need it aren't the people I work with.\n\nThe people I work with are on good money, did everything they were told to do, and got a number back that didn't make sense. They've read the basics. They've read them four times at eleven at night.\n\nWhat nobody has explained is why their borrowing power came back 30% below what they needed. Why their HECS matters more than their car loan. Why a pre-approval meant nothing at an auction.\n\nThat's the gap. Not the definitions.\n\nSo that's all this account does. The bit after the basics.\n\nFollow if you already know the basics and nobody's helping you past them.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#mortgagebroker #firsthomebuyer #borrowingpower #buildinpublic #youngprofessionals"}}, {"id": "C-P5-01", "group": "the-journey", "groupLabel": "My journey as a broker", "pillar": 5, "format": "Carousel", "lane": "-", "type": "process", "title": "741 to 10,000, in public", "hook": "741 followers. I'm taking this account to 10,000 in a year, and you get to watch.", "angle": "The commitment post, with the week one miss on it.", "cta": "Follow to watch it happen, or watch it fail.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "741 followers. I'm taking this account to 10,000 in a year, and you get to watch.", "expires": null, "confirm": "Use the live follower count on the morning you post.", "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "741 followers. I'm taking this account to 10,000 in a year, and you get to watch."], ["The goal", "10,000 by 14 September 2027. That's about 178 new followers a week, every week, for a year."], ["The system", "Eight posts a week. Four reels, four carousels. Filmed in one sitting on a Wednesday."], ["What you'll get", "The numbers your bank won't put on screen. What lenders actually do, not what the ads say. And the real figures from this account every week."], ["What you won't get", "No rate quotes. No client details. No 'you will be approved'. I'm a credit rep, not a hype account."], ["Week one, honestly", "Six of eight. I missed my own batch day in week one. I'm telling you because I said I'd tell you."], ["Close", "Follow to watch it happen. Or watch it fail. Both are useful."]], "disclaimerText": "General market commentary only, not advice.", "caption": "741 followers. I'm taking this account to 10,000 in a year, and you get to watch.\n\nThat's about 178 new followers a week, every week, for twelve months. Eight posts a week, four reels and four carousels, filmed in one sitting.\n\nWeek one I missed my own batch day and landed six of eight. I'm telling you that in week one rather than week forty, because a build-in-public account that only posts the wins isn't building anything in public.\n\nWhat you'll get: the numbers your bank won't put on screen, what lenders actually do rather than what the ads say, and the real figures from this account every week.\n\nWhat you won't get: rate quotes, client details, or anyone telling you you'll be approved.\n\nFollow to watch it happen, or watch it fail. Both are useful.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#buildinpublic #mortgagebroker #sydneyproperty #firsthomebuyer"}}, {"id": "C-P5-02", "group": "the-journey", "groupLabel": "My journey as a broker", "pillar": 5, "format": "Carousel", "lane": "-", "type": "process", "title": "Week one, the actual numbers", "hook": "Week one in public. Here are the real numbers, including the bad ones.", "angle": "The weekly figures post. Template, refresh each week.", "cta": "Follow for the numbers every week, good or bad.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "Week one in public. Here are the real numbers, including the bad ones.", "expires": null, "confirm": "Template. Fill every [CONFIRM] from the Sunday review before building.", "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "Week one in public. Here are the real numbers, including the bad ones."], ["Posted", "[CONFIRM] of 8. What went out, what didn't, and why."], ["Followers", "Started the week on [CONFIRM]. Finished on [CONFIRM]. The line I need to hold is about 178 a week."], ["Best post", "[CONFIRM title]. [CONFIRM] views, [CONFIRM] shares. Here's what I think made it work."], ["Worst post", "[CONFIRM title]. [CONFIRM] views. Here's what I got wrong, said plainly."], ["The one change for next week", "[CONFIRM]. One change only. Three changes at once and you can't tell which one worked."], ["Close", "Same time next week, whatever the numbers say."]], "disclaimerText": "General market commentary only, not advice.", "caption": "Week one in public. Here are the real numbers, including the bad ones.\n\n→ posted: [CONFIRM] of 8\n→ followers: [CONFIRM] to [CONFIRM]. The line I need to hold is about 178 a week\n→ best post: [CONFIRM], and what I think made it work\n→ worst post: [CONFIRM], and what I got wrong\n\nOne change for next week: [CONFIRM].\n\nOne change only. Three at once and you can't tell which one worked.\n\nSame time next week, whatever the numbers say.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#buildinpublic #contentcreator #mortgagebroker #smallbusiness"}}, {"id": "C-P5-03", "group": "the-journey", "groupLabel": "My journey as a broker", "pillar": 5, "format": "Carousel", "lane": "-", "type": "contrarian", "title": "What I'll never post", "hook": "There are four things I'll never put on this account. Here's why that matters to you.", "angle": "A trust post that doubles as a compliance statement.", "cta": "Follow if that's the kind of account you want in your feed.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "There are four things I'll never put on this account. That's the point of it.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "There are four things I'll never put on this account. That's the point of it."], ["Never a rate", "I'm a credit representative. Putting a product rate on a reel is a promotion, and it's out of date the week after. If you want a rate, ask me and I'll give you one for your situation."], ["Never a client's details", "Every deal I break down is de-identified. No names, no addresses, no exact figures. If you'd recognise yourself, I've asked you first."], ["Never 'you'll be approved'", "Nobody can promise you that, and the people who imply it are selling something."], ["Never a lender as the villain or the hero", "Policies change monthly. A lender that's wrong for you today can be right for you in March. Naming one is lazy and it dates badly."], ["What's left", "The mechanism. What actually happens inside an assessment, and what it means for your number."], ["Close", "That's a smaller account than the alternative. It's the only one worth running."]], "disclaimerText": "General market commentary only, not advice.", "caption": "There are four things I'll never put on this account. That's the point of it.\n\n→ never a rate. I'm a credit representative. A product rate on a reel is a promotion and it's stale a week later. Ask me and I'll give you one for your situation\n→ never a client's details. Every deal I break down is de-identified. If you'd recognise yourself, I asked you first\n→ never \"you'll be approved\". Nobody can promise that, and people who imply it are selling something\n→ never a lender as villain or hero. Policies change monthly. The wrong lender today can be the right one in March\n\nWhat's left is the mechanism. What actually happens inside an assessment, and what it means for your number.\n\nThat's a smaller account than the alternative. It's the only one worth running.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#mortgagebroker #buildinpublic #finance #contentcreator"}}, {"id": "C-P5-04", "group": "the-journey", "groupLabel": "My journey as a broker", "pillar": 5, "format": "Carousel", "lane": "-", "type": "process", "title": "A week in this job, honestly", "hook": "Seven days as a broker. Not the highlight reel.", "angle": "Day in the life, but the boring true version. Relatability without a sales line.", "cta": "Ask me anything about the job in the comments.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "Seven days as a mortgage broker. Not the highlight reel.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "Seven days as a mortgage broker. Not the highlight reel."], ["Monday", "Chasing documents. Not lending. Chasing. Payslips, an accountant's letter, an insurance certificate somebody swears they sent."], ["Tuesday", "Two calls with people who think they can't buy. One of them can. That's the best hour of the week."], ["Wednesday", "Filming day. Eight posts in one sitting, or that's the plan. Client files usually have an opinion about that."], ["Thursday", "An approval lands. Then a condition list lands two hours later, and the approval feels smaller."], ["Friday", "Settlement. Which mostly means watching an inbox and hoping nobody's account number has a typo in it."], ["The weekend", "Auction results Saturday evening, because it's the only real-time read on the market you get. Then actually off on Sunday. Mostly."], ["Close", "Almost none of this is about rates. Nearly all of it is about getting a file to add up."]], "disclaimerText": "General market commentary only, not advice.", "caption": "Seven days as a mortgage broker. Not the highlight reel.\n\n→ Monday: chasing documents. Payslips, an accountant's letter, an insurance certificate someone swears they sent\n→ Tuesday: two calls with people who think they can't buy. One of them can. Best hour of the week\n→ Wednesday: filming day. Eight posts in one sitting, or that's the plan\n→ Thursday: an approval lands, then a condition list lands two hours later\n→ Friday: settlement. Mostly watching an inbox and hoping nobody's account number has a typo\n→ Saturday: auction results, the only real-time read on the market you get\n→ Sunday: off. Mostly.\n\nAlmost none of this is about rates. Nearly all of it is getting a file to add up.\n\nAsk me anything about the job in the comments.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#dayinthelife #mortgagebroker #smallbusiness #buildinpublic #sydney"}}]}</script>
<script>

const PLAN = JSON.parse(document.getElementById('plan').textContent);
const S = PLAN.settings;
const PILLARS = Object.fromEntries(S.pillars.map(p=>[p.n,p]));
const DAY = 86400000;
const state = { slots:{}, growth:[], reviews:{}, meta:{}, db:null, dbState:'connecting', tab:'week', weekIdx:null, sort:{key:'date',dir:1}, filters:{format:'',pillar:'',status:'',week:''}, growthRange:'8w', pillarMetric:'score', insightsView:'pillars', news:[], newsFilter:0, bank:[] };
PLAN.slots.forEach(s=>state.slots[s.id]={...s,status:s.status||'PLANNED',metrics:s.metrics||{}});
state.growth = PLAN.growth.slice();

// ---------- date helpers ----------
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const todayISO=()=>iso(new Date());
const fmtShort=s=>{const d=parse(s);return d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});};
const fmtDM=s=>{const d=parse(s);return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});};
const W1 = parse(PLAN.weeks[0].start);
const WEEKS=()=>(state.meta.weeks&&state.meta.weeks.length)?state.meta.weeks:PLAN.weeks;
const STORY=d=>(state.meta.stories&&state.meta.stories[d])||PLAN.stories[d]||'';
const MOMENTS=()=>(state.meta.moments&&state.meta.moments.length)?state.meta.moments:PLAN.moments;
function weekFor(dateISO){
  const d=parse(dateISO); const n=Math.floor((d-W1)/DAY/7);
  const known=WEEKS()[n];
  if(known) return known;
  const st=new Date(W1.getTime()+n*7*DAY), en=new Date(st.getTime()+6*DAY);
  return {id:'W'+(n+1),n:n+1,start:iso(st),end:iso(en),theme:'Not yet planned. The Sunday review fills this in.',notes:''};
}
function allWeeks(){
  const ids=new Set(WEEKS().map(w=>w.id));
  Object.values(state.slots).forEach(s=>{const w=weekFor(s.date);ids.add(w.id);});
  const t=weekFor(todayISO()); ids.add(t.id);
  return [...ids].map(id=>{const n=parseInt(id.slice(1),10);const st=new Date(W1.getTime()+(n-1)*7*DAY);return weekFor(iso(st));}).sort((a,b)=>a.n-b.n);
}

// ---------- metrics ----------
const num=v=>(v===''||v==null||isNaN(Number(v)))?null:Number(v);
function rates(s){
  const m=s.metrics||{}; const reach=num(m.reach);
  const r={reach, views:num(m.views), likes:num(m.likes), comments:num(m.comments), shares:num(m.shares), saves:num(m.saves), profileVisits:num(m.profileVisits), follows:num(m.follows), avgWatchPct:num(m.avgWatchPct)};
  const div=(a)=> (a!=null&&reach)?a/reach:null;
  r.shareRate=div(r.shares); r.saveRate=div(r.saves); r.followRate=div(r.follows); r.visitRate=div(r.profileVisits);
  const eng=[r.likes,r.comments,r.shares,r.saves].filter(v=>v!=null);
  r.engRate=(eng.length&&reach)?eng.reduce((a,b)=>a+b,0)/reach:null;
  r.replay=(r.views!=null&&reach)?r.views/reach:null;
  return r;
}
const median=a=>{if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;};
const WEIGHTS={reach:.25,shareRate:.25,saveRate:.15,followRate:.25,engRate:.10};
function scored(){
  const posted=Object.values(state.slots).filter(s=>s.status==='POSTED'&&num(s.metrics&&s.metrics.reach)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const out={};
  posted.forEach((s,i)=>{
    const r=rates(s);
    let pool=posted.slice(0,i).filter(p=>p.format===s.format).slice(-20);
    let provisional=false;
    if(pool.length<8){pool=posted.slice(0,i).slice(-20);provisional=true;}
    if(pool.length<4){out[s.id]={score:null,provisional:true,r,n:pool.length};return;}
    let lw=0,acc=0;
    for(const k in WEIGHTS){
      const v=r[k]; if(v==null||v<=0) continue;
      const med=median(pool.map(p=>rates(p)[k]).filter(x=>x!=null&&x>0));
      if(!med) continue;
      acc+=WEIGHTS[k]*Math.log2(v/med); lw+=WEIGHTS[k];
    }
    if(!lw){out[s.id]={score:null,provisional:true,r,n:pool.length};return;}
    const score=Math.max(1,Math.min(100,Math.round(50+25*(acc/lw))));
    out[s.id]={score,provisional,r,n:pool.length};
  });
  return out;
}
const scoreClass=v=>v==null?'na':v>=70?'good':v>=40?'mid':'poor';

// ---------- streak ----------
function weekStats(w){
  const slots=Object.values(state.slots).filter(s=>s.date>=w.start&&s.date<=w.end);
  const posted=slots.filter(s=>s.status==='POSTED').length;
  const filmed=slots.filter(s=>s.status==='FILMED').length;
  const skipped=slots.filter(s=>s.status==='SKIPPED');
  const reasons={}; skipped.forEach(s=>{const k=(s.skipReason||'unstated').toLowerCase();reasons[k]=(reasons[k]||0)+1;});
  return {slots,planned:slots.length,posted,filmed,skipped:skipped.length,reasons,hit:slots.length?posted/Math.max(S.postsPerWeek,slots.length):0,complete:w.end<todayISO()};
}
function streak(){
  const weeks=allWeeks().filter(w=>w.end<todayISO());
  let cur=0,best=0,run=0,brokenLast=false;
  weeks.forEach(w=>{const st=weekStats(w); if(st.posted>=S.postsPerWeek){run++;best=Math.max(best,run);}else{run=0;}});
  cur=run;
  if(weeks.length){const last=weekStats(weeks[weeks.length-1]); brokenLast=last.posted<S.postsPerWeek;}
  return {cur,best,brokenLast,completed:weeks.length};
}

// ---------- growth ----------
function pace(dateISO){
  const t0=parse(S.startDate),t1=parse(S.goalDate),t=parse(dateISO);
  const f=Math.min(1,Math.max(0,(t-t0)/(t1-t0)));
  return S.startFollowers+(S.goal-S.startFollowers)*f;
}
function growthSummary(){
  const g=state.growth.slice().sort((a,b)=>a.date<b.date?-1:1);
  const first=g[0],last=g[g.length-1];
  const weeksTotal=(parse(S.goalDate)-parse(S.startDate))/DAY/7;
  const weeksElapsed=Math.max(0,(parse(last.date)-parse(S.startDate))/DAY/7);
  const weeksLeft=Math.max(0.1,weeksTotal-weeksElapsed);
  const requiredNow=(S.goal-last.count)/weeksLeft;
  const requiredOriginal=(S.goal-S.startFollowers)/weeksTotal;
  const actualRate=weeksElapsed>=1?(last.count-S.startFollowers)/weeksElapsed:null;
  const prev=g.length>1?g[g.length-2]:null;
  const delta7=prev?last.count-prev.count:null;
  return {first,last,requiredNow,requiredOriginal,actualRate,onPace:last.count>=pace(last.date),paceNow:pace(last.date),delta7,prev};
}

// ---------- render helpers ----------
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pillarChip(n,filled){const p=PILLARS[n]||{short:'P'+n};if(filled)return `<span class="chip tagfill p${n}">${esc(p.short)}</span>`;return `<span class="chip" style="background:var(--surface2);border-color:rgba(17,38,59,.6)"><span class="dot p${n}"></span>${esc(p.short)}</span>`;}
function scoreBadge(sc){if(!sc||sc.score==null)return `<span class="score na">n/a</span>`;return `<span class="score ${scoreClass(sc.score)} num" title="${sc.provisional?'provisional, under 8 posts in baseline':'vs trailing median'}">${sc.score}${sc.provisional?'*':''}</span>`;}

  } else th+=`<div class="empty">Nothing scheduled to post today.</div>`;

  tc.innerHTML=th; root.appendChild(tc);

  // week nav + compliance
  const nav=el('div','weeknav');
  nav.innerHTML=`<button class="btn small" id="wkPrev" ${state.weekIdx===0?'disabled':''}>&lsaquo; Prev</button><div style="text-align:center"><div class="wk">Week ${w.n}${w.id===weekFor(today).id?' &middot; this week':''}</div><div class="rng">${fmtDM(w.start)} to ${fmtDM(w.end)} &middot; batch ${w.batch?fmtDM(w.batch):'Wed'}</div></div><button class="btn small" id="wkNext" ${state.weekIdx>=weeks.length-1?'disabled':''}>Next &rsaquo;</button>`;
