<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000814">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Road to 10k">
<meta name="description" content="Instagram content calendar, post log and growth tracker for @mattwade_____. Data stays on this device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Road to 10k</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
html{color-scheme:dark;background:#000814}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{
  /* Copilot Money reference tokens */
  --color-midnight-canvas:#000814; --color-deep-surface:#010d1e; --color-indigo-surface:#001533; --color-cobalt-surface:#00215e;
  --color-paper-white:#ffffff; --color-fog:#ccced0; --color-mist:#999ca1; --color-steel-border:#11263b; --color-signal-blue:#1c6cff;
  --color-tag-coral:#ff4433; --color-tag-lime:#00cc4b; --color-tag-tangerine:#ff8833; --color-tag-hot-pink:#ff33aa; --color-tag-violet:#9019e6;
  --color-tag-sunflower:#ffcc02; --color-tag-sky:#00acfe; --color-tag-ember:#ea687c; --color-tag-olive:#94ae43; --color-tag-slate:#5c6f8a;
  /* app roles */
  --bg:var(--color-midnight-canvas); --surface:var(--color-deep-surface); --surface2:var(--color-indigo-surface); --surface3:var(--color-cobalt-surface);
  --line:var(--color-steel-border);
  --ink:var(--color-paper-white); --ink2:var(--color-fog); --muted:var(--color-mist);
  --accent:var(--color-signal-blue); --accent-ink:#ffffff; --accent-soft:rgba(28,108,255,.18);
  --good:var(--color-tag-lime); --good-soft:rgba(0,204,75,.16); --warn:var(--color-tag-sunflower); --warn-soft:rgba(255,204,2,.16); --bad:var(--color-tag-coral); --bad-soft:rgba(255,68,51,.18);
  --p1:var(--color-tag-sky); --p2:var(--color-tag-sunflower); --p3:var(--color-tag-coral); --p4:var(--color-tag-violet); --p5:var(--color-tag-lime);
  --p1-ink:#000814; --p2-ink:#000814; --p3-ink:#ffffff; --p4-ink:#ffffff; --p5-ink:#000814;
  --shadow:rgba(255,255,255,.08) 4px 4px 8px 0 inset, rgba(255,255,255,.16) 4px 4px 16px -4px inset, rgba(0,0,0,.2) -4px -4px 16px -4px inset, rgba(255,255,255,.4) 1px 1px 1px -.5px inset;
  --shadow-glow:rgba(38,113,217,.08) 0 0 12px 0 inset, rgba(0,0,0,.32) 0 -4px 8px 0 inset;
  --shadow-pressed:rgba(0,0,0,.2) -4px -4px 16px -4px inset;
  --radius:24px; --radius-btn:16px; --radius-tag:20px;
  --font-display:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:300;font-size:15px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;font-feature-settings:"ss07"}
b,strong{font-weight:500}
.display,h3,.tile .v,.streak .n,.weeknav .wk,.slot .when .n,.brand .h,.sheet h3,.prompter .bar>div>div:first-child{font-family:var(--font-display)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px 8px}
header.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:820px;margin:0 auto;padding-inline:16px}
.brand{display:flex;flex-direction:column;gap:0}
.brand .h{font-weight:600;font-size:20px;letter-spacing:-.02em;line-height:1}
.brand .s{font-size:12px;color:var(--muted);font-weight:300}
.streak{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:9999px;background:var(--surface);border:1px solid rgba(17,38,59,.6);box-shadow:var(--shadow);font-size:12px;font-weight:300;color:var(--ink2);white-space:nowrap}
.streak .n{font-size:22px;font-weight:600;line-height:1;color:var(--ink)}
.streak.ok .n{color:var(--good)} .streak.broken{background:var(--bad-soft);border-color:var(--bad)} .streak.broken .n{color:var(--bad)}
.streak.zero .n{color:var(--muted)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin:24px 0 10px;font-weight:600;line-height:1}
h3{font-size:22px;margin:0 0 6px;font-weight:500;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.card{background:var(--surface);border:1px solid rgba(17,38,59,.4);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.today{background:var(--surface2);box-shadow:var(--shadow),var(--shadow-glow);overflow:visible;position:relative}
.hero-tags{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:2px 0 10px}
.hero-tags .chip{padding:7px 14px;font-size:12px;font-weight:500;letter-spacing:.02em;text-transform:uppercase;border-radius:var(--radius-tag);box-shadow:rgba(255,255,255,.35) 1px 1px 1px -.5px inset, rgba(0,0,0,.25) -2px -2px 6px -2px inset}
.hero-tags .chip:nth-child(1){transform:rotate(-6deg)}
.hero-tags .chip:nth-child(2){transform:rotate(4deg)}
.hero-tags .chip:nth-child(3){transform:rotate(-2deg)}
.hero-tags .chip:nth-child(4){transform:rotate(5deg)}
.hero-tags .chip:nth-child(5){transform:rotate(-3deg)}
.tagfill.p1{background:var(--p1);color:var(--p1-ink)} .tagfill.p2{background:var(--p2);color:var(--p2-ink)} .tagfill.p3{background:var(--p3);color:var(--p3-ink)} .tagfill.p4{background:var(--p4);color:var(--p4-ink)} .tagfill.p5{background:var(--p5);color:var(--p5-ink)}
.hero-tags .chip.fmt{background:var(--color-tag-slate);color:#fff}
.hero-tags .chip.TOPICAL{background:var(--color-tag-tangerine);color:#000814}
.hero-tags .chip.EVERGREEN{background:var(--color-tag-olive);color:#000814}
.hero-tags .chip.POSTED{background:var(--good);color:#000814} .hero-tags .chip.SKIPPED{background:var(--bad);color:#fff} .hero-tags .chip.FILMED{background:var(--accent);color:#fff} .hero-tags .chip.PLANNED{background:var(--surface3);color:var(--ink2);border-color:var(--line)}
.today h3{font-size:30px;line-height:1.05;letter-spacing:-.02em;font-weight:600}
.today .hook{font-size:17px;font-weight:200;color:var(--ink);letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid rgba(17,38,59,.4);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.tile .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.tile .v{font-size:34px;font-weight:600;line-height:1;margin-top:6px;letter-spacing:-.02em}
.tile .d{font-size:12px;color:var(--ink2);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-tag);font-size:11.5px;font-weight:500;letter-spacing:.02em;border:1px solid transparent;white-space:nowrap}
.chip.PLANNED{background:transparent;border-color:rgba(204,206,208,.35);color:var(--ink2)}
.chip.FILMED{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip.POSTED{background:var(--good-soft);color:var(--good)} .hero-tags .chip.POSTED{color:#000814}
.chip.SKIPPED{background:var(--bad-soft);color:var(--bad)}
.chip.EVERGREEN{background:var(--surface2);color:var(--ink2);border-color:rgba(17,38,59,.6)}
.chip.TOPICAL{background:rgba(255,136,51,.16);color:var(--color-tag-tangerine)}
.chip.fmt{background:var(--surface2);color:var(--ink);border-color:rgba(17,38,59,.6)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.p1{background:var(--p1)} .p2{background:var(--p2)} .p3{background:var(--p3)} .p4{background:var(--p4)} .p5{background:var(--p5)}
.slot{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:start;padding:14px 0;border-top:1px solid rgba(17,38,59,.7)}
.slot:first-of-type{border-top:0;padding-top:4px}
.slot .when{display:flex;flex-direction:column;align-items:center;gap:1px;padding-top:2px}
.slot .when .d{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.slot .when .n{font-size:24px;font-weight:600;line-height:1}
.slot .when .t{font-size:11px;color:var(--muted)}
.slot .body{min-width:0}
.slot .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.slot .title{font-weight:500;font-size:16px;letter-spacing:-.01em}
.slot .hook{font-size:14px;color:var(--ink2);margin-top:3px;font-weight:300}
.slot .act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.score{min-width:40px;text-align:center;padding:5px 10px;border-radius:12px;font-weight:600;font-size:14px;font-family:var(--font-display)}
.score.good{background:var(--good-soft);color:var(--good)} .score.mid{background:var(--warn-soft);color:var(--warn)} .score.poor{background:var(--bad-soft);color:var(--bad)} .score.na{background:var(--surface2);color:var(--muted);font-weight:500;font-size:12px}
.btn{border:1px solid rgba(255,255,255,.7);background:transparent;color:var(--ink);border-radius:var(--radius-btn);padding:10px 16px;font-weight:300;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:400}
.btn.small{padding:7px 12px;font-size:12.5px;border-radius:12px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 6px}
.weeknav .wk{font-weight:600;font-size:20px;letter-spacing:-.02em}
.weeknav .rng{font-size:12px;color:var(--muted)}
.progress{height:8px;border-radius:9999px;background:var(--surface3);overflow:hidden;margin:10px 0 6px;box-shadow:var(--shadow-pressed)}
.progress i{display:block;height:100%;background:var(--good);border-radius:999px}
.progress i.short{background:var(--color-tag-tangerine)}
.storyline{font-size:14px;color:var(--ink2);white-space:pre-line;font-weight:300}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid rgba(17,38,59,.8);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;box-shadow:rgba(255,255,255,.06) 0 1px 0 0 inset}
.tab{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:400;letter-spacing:.02em;color:var(--muted);border-radius:12px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid rgba(17,38,59,.4);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px;font-weight:300}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{position:sticky;top:0;background:var(--surface2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);cursor:pointer;user-select:none;font-weight:600}
th.on{color:var(--accent)}
td.hookcell{white-space:normal;min-width:220px;max-width:340px}
tr.rowgood td:first-child{box-shadow:inset 4px 0 0 var(--good)} tr.rowmid td:first-child{box-shadow:inset 4px 0 0 var(--warn)} tr.rowpoor td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 10px}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
svg.chart{width:100%;height:auto;display:block;touch-action:none}
svg.chart text{fill:var(--muted);font-size:10px;font-family:inherit}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .pace{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
svg.chart .line{stroke:var(--accent);stroke-width:2;fill:none}
svg.chart .area{fill:var(--accent);opacity:.12}
svg.chart .pt{fill:var(--accent);stroke:var(--bg);stroke-width:2}
svg.chart .pt.last{r:5}
svg.chart .goal{stroke:var(--good);stroke-width:1.5;stroke-dasharray:2 4}
.tip{position:absolute;pointer-events:none;background:var(--surface3);color:var(--ink);border:1px solid var(--line);font-size:12px;padding:6px 10px;border-radius:12px;transform:translate(-50%,-120%);white-space:nowrap;display:none}
.chartbox{position:relative}
.bar{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.bar:first-child{border-top:0}
.bar .track{height:10px;border-radius:9999px;background:var(--surface3);overflow:hidden;box-shadow:var(--shadow-pressed)}
.bar .track i{display:block;height:100%;border-radius:999px}
.bar .lab{display:flex;align-items:center;gap:7px;font-weight:400}
.bar .val{text-align:right;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:12.5px;font-weight:400;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hookrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.hookrow:first-child{border-top:0}
.hookrow .h{font-weight:500;font-size:14px}
.hookrow .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11px;padding:3px 9px;border-radius:9999px;background:var(--surface2);color:var(--ink2);font-weight:400}
.sheet-bg{position:fixed;inset:0;background:rgba(0,8,20,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:40px 40px 0 0;padding:22px 20px calc(28px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);border-top:1px solid rgba(17,38,59,.6)}
.sheet h3{font-size:17px}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:15px;width:100%;font-weight:300;box-shadow:var(--shadow-pressed)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.statusbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.statusbtns button{border-radius:9999px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:13px;font-weight:400}
.statusbtns button[aria-pressed="true"].PLANNED{border-color:var(--ink2);color:var(--ink)}
.statusbtns button[aria-pressed="true"].FILMED{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.statusbtns button[aria-pressed="true"].POSTED{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.statusbtns button[aria-pressed="true"].SKIPPED{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 16px;border-radius:9999px;font-size:13px;z-index:30}
.conn{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.conn.on i{background:var(--good)} .conn.off i{background:var(--bad)}
.review{border-left:4px solid var(--warn)}
.review .one{font-weight:600;font-size:15px}
.moments{font-size:13px}
.moments div{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.moments div:first-child{border-top:0}
.moments .dt{color:var(--muted);font-weight:600}
.themes .card{padding:12px 14px}
.themes .wk{font-weight:700;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.small{font-size:12.5px;color:var(--muted)}
.swaprow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.swaprow:first-child{border-top:0}
.swaprow.cool{opacity:.55}
.swaprow .t{font-weight:500;font-size:15px;letter-spacing:-.01em}
.swaprow .h{font-size:13.5px;color:var(--ink2);margin-top:3px;font-weight:300}
.swaprow .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.warn{background:rgba(255,136,51,.14);color:var(--color-tag-tangerine);border-radius:12px;padding:8px 10px;font-size:12.5px;margin-top:6px}
.current{background:var(--surface2);border-radius:16px;padding:10px 12px;margin-top:8px;font-size:13px}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;text-decoration:none;color:var(--ink)}
.linkrow:first-of-type{border-top:0}
.linkrow .r{color:var(--accent);font-weight:500;flex:none}
.linkrow .n{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.chips button{border:1px solid var(--line);background:var(--surface2);border-radius:9999px;padding:7px 13px;font-size:12.5px;font-weight:400;color:var(--ink2)}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.newsitem{padding:10px 0;border-top:1px solid var(--line)}
.newsitem:first-child{border-top:0}
.newsitem .t{font-weight:600;font-size:14.5px}
.newsitem .m{font-size:13px;color:var(--ink2);margin-top:3px}
.rhythm{display:grid;grid-template-columns:44px 1fr auto;gap:8px 10px;font-size:13px;align-items:center}
.rhythm .d{font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.script{font-size:17px;line-height:1.55;white-space:pre-line;padding:16px 18px;border-radius:20px;background:var(--surface2);margin-top:10px;font-weight:200;box-shadow:var(--shadow-pressed)}
.script .hookline{font-weight:600}
.slides{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.slide{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.slide:first-child{border-top:0}
.slide .n{font-weight:700;color:var(--accent);font-size:12px;padding-top:2px}
.slide .h{font-weight:600;color:var(--accent);font-size:13px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13px;margin-top:8px}
.kv .k{color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:11px;padding-top:2px}
details.cap{margin-top:8px}
details.cap summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--accent)}
details.cap pre{white-space:pre-wrap;font:inherit;font-size:13.5px;background:var(--surface2);padding:10px 12px;border-radius:10px;margin:6px 0 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.prompter{position:fixed;inset:0;z-index:40;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.prompter .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid var(--line)}

d": null, "swapHistory": []}, {"id": "W1-02", "week": "W1", "date": "2026-09-17", "day": "Thu", "time": "12:30", "format": "Carousel", "lane": "-", "pillar": 1, "type": "mechanism", "title": "Negative gearing is leaving the calculator", "hook": "Seven lenders cut investor borrowing power by up to 20%. Nobody sent you a letter.", "angle": "Since the Budget quarantined rental losses on established property bought after 12 May 2026 (from 1 July 2027), lenders have started removing the negative gearing add-back from how they assess investors. Same income, same rent, less borrowing. Describe the mechanism, do not name the lenders.", "kind": "TOPICAL", "filmWindow": "Build on batch day. Policy is set, numbers are stable.", "cta": "Send this to anyone bidding on an investment property this spring.", "disclaimer": "tax", "onScreen": "", "script": {"setup": "Carousel, build from the copy. Navy, sky headings, white body, 1080x1350. Do not name the lenders.", "order": 5, "slides": [["Cover", "Seven lenders cut investor borrowing power by up to 20%. Nobody sent you a letter."], ["What changed", "In the May Budget the government said rental losses on established property bought after 12 May 2026 stop offsetting your wages from 1 July 2027. New builds are exempt."], ["Why your bank cares", "For years lenders added the tax benefit of a rental loss back into your income when they assessed you. If the concession is going, so is the add-back."], ["Three columns", "Before: tax saving added back to income · Now: assessed on the cash shortfall alone · Result: up to 20% less borrowing on some calculators"], ["Who feels it", "The nine in ten investors with one or two properties, buying the next one this spring. Same job, same rent, smaller number."], ["The trade-off", "The new number is more honest. It's what the property actually costs you each month. Not a bad thing to know before you bid."], ["Close", "Get your capacity re-run before you bid. / Not after. A pre-approval from May might not be a pre-approval today."]], "disclaimerText": "Anything to do with tax or structuring is your accountant's call, not mine. Illustrative only, not a quote or an offer.", "caption": "Seven lenders cut investor borrowing power by up to 20%. Nobody sent you a letter.\n\nSince the Budget quarantined rental losses on established property bought after 12 May 2026 (from 1 July 2027), lenders have started removing the negative gearing add-back from how they assess investors.\n\nSame income. Same rent. Smaller number.\n\nThe new number is more honest, it's what the property actually costs you each month. But if you're bidding this spring on a pre-approval from May, get it re-run first.\n\nSend this to anyone bidding on an investment property this spring.\n\nAnything to do with tax or structuring is your accountant's call, not mine. Illustrative only, not a quote or an offer. General market commentary, not advice. [credit rep line]\n\n#negativegearing #propertyinvestor #borrowingpower #mortgagebroker #australianproperty"}, "group": "market-economics", "bankId": null, "swapHistory": []}, {"id": "W1-03", "week": "W1", "date": "2026-09-18", "day": "Fri", "time": "06:45", "format": "Reel", "lane": "B", "pillar": 4, "type": "mechanism", "title": "The bank's favourite structure", "hook": "The bank's favourite loan structure is the one that costs you the most.", "angle": "Deal breakdown, de-identified composite. A client came in with a home and an investment property on one facility with one bank. Cross-collateralisation ties every property to every loan. Sell one and the bank revalues the lot and can hold the proceeds. We split them: ring-fenced loans keep each property's equity yours. Trade-off: more paperwork, sometimes two sets of fees, and it takes a broker who will do the work.", "kind": "EVERGREEN", "filmWindow": "Not filmed 16 Sep. Film in one 45-minute sitting Thu 17 or Fri 18 morning, or roll into the Wed 23 Sep batch and post in week 2.", "cta": "Save this before your next purchase.", "disclaimer": "general", "onScreen": "One loan, two houses. Guess who benefits.", "script": {"setup": "Desk plus a second angle 30 to 40 degrees off, Lane B. Outfit 2. Clap at the top of each take, cut to B on every point.", "order": 4, "words": 214, "seconds": 80, "spoken": "The bank's favourite loan structure is the one that costs you the most.\n\nIt's called cross-collateralisation, and most people who have it don't know they have it.\n\nHere's how it happens. You own your home. You buy an investment property. The bank offers to lend against both together. One facility, one application, less paperwork. Sounds helpful.\n\nNow here's what you actually signed.\n\nEvery property secures every loan. The bank has a claim over the lot.\n\nSell one, and the bank revalues everything before it lets go. If values have dipped, it can hold your sale proceeds to fix up the loan on the one you kept.\n\nWant to refinance one property to a better lender? You can't. They come as a set.\n\nAnd every valuation, every top-up, runs through one credit team's view of your whole position.\n\nThe alternative is ring-fencing. Each property, its own loan. Use equity from one as a cash deposit on the next, but keep the securities separate.\n\nThe trade-off is real. More paperwork, sometimes two sets of fees, and it takes a broker willing to do the work instead of ticking the bank's box.\n\nBut you keep your options. And over ten years, options are worth more than convenience.", "onScreen": "One loan, two houses. Guess who benefits. Then each point as text as you say it.", "numbers": "None. The four points appear as text on each turn.", "disclaimerText": "General market commentary only, not advice.", "caption": "The bank's favourite loan structure is the one that costs you the most.\n\nCross-collateralisation. One facility over your home and your investment. Less paperwork, and here's what you signed:\n\n→ every property secures every loan\n→ sell one and the bank revalues the lot first, and can hold your proceeds\n→ refinance one to a better lender? They come as a set\n→ every valuation runs through one credit team's view of everything\n\nThe alternative is ring-fencing. Each property, its own loan. Equity from one becomes a cash deposit on the next.\n\nThe trade-off: more paperwork, sometimes two sets of fees, and a broker willing to do the work.\n\nOver ten years, options beat convenience. Save this before your next purchase.\n\nGeneral market commentary only, not advice. [credit rep line]\n\n#propertyinvestor #loanstructure #mortgagebroker #australianproperty #investmentproperty"}, "group": "deal-breakdowns", "bankId": null, "swapHistory": []}, {"id": "W1-04", "week": "W1", "date": "2026-09-19", "day": "Sat", "time": "08:30", "format": "Carousel", "lane": "-", "pillar": 5, "type": "process", "title": "742 to 10,000, in public", "hook": "742 followers. I'm taking this account to 10,000 in a year, and you get to watch.", "angle": "The commitment post. Where the account is, the goal, the system (4 reels, 4 carousels, one filming day a week), what I will share (real numbers every week, misses included) and what I will never share (client details, rate quotes, advice). Hold me to it.", "kind": "EVERGREEN", "filmWindow": "", "cta": "Follow to watch it happen, or watch it fail.", "disclaimer": "general", "onScreen": "", "script": {"setup": "Carousel, build from the copy.", "order": 6, "slides": [["Cover", "742 followers. I'm taking this account to 10,000 in a year, and you get to watch."], ["Where I'm starting", "742 followers on 14 September 2026. A broker's account that posts when it remembers to."], ["The goal", "10,000 by 14 September 2027. That's about 178 new followers a week, every week."], ["The system", "→ 4 reels and 4 carousels a week → one filming day, Wednesday → a story every day → a Sunday review with real numbers"], ["What you'll get", "The read on rates and prices nobody else is running. How lenders actually assess you. Structure over rate. The positions most brokers won't say on camera."], ["What you won't get", "Client details. Rate quotes. Advice dressed up as content. A post that reads like a bank wrote it."], ["Hold me to it", "Every Sunday I'll post the numbers. Posts planned, posts published, followers gained. Misses included."], ["Close", "Follow to watch it happen. / Or watch it fail. Either way you'll see the numbers."]], "disclaimerText": "General market commentary only, not advice.", "caption": "742 followers. I'm taking this account to 10,000 in a year, in public.\n\nThe system: 4 reels and 4 carousels a week, one filming day, a story every day, and a Sunday review where I post the real numbers. Planned, published, followers gained. Misses included.\n\nWhat you'll get: the read on rates and prices nobody else is running, how lenders actually assess you, and the positions most brokers won't say on camera.\n\nWhat you won't get: client details, rate quotes, or advice dressed up as content.\n\nFollow to watch it happen, or watch it fail.\n\nGeneral market commentary only, not advice. [credit rep line]\n\n#mortgagebroker #buildinpublic #sydneybroker #australianproperty #loanmarket"}, "group": "the-journey", "bankId": null, "swapHistory": []}, {"id": "W1-05", "week": "W1", "date": "2026-09-20", "day": "Sun", "time": "08:30", "format": "Carousel", "lane": "-", "pillar": 1, "type": "correction", "title": "The greedy landlord is mostly fiction", "hook": "Nine in ten property investors own one or two places. The greedy landlord is mostly fiction.", "angle": "ATO data: about 71% of investors hold one property, another 19% hold two. Investor loan numbers fell 8.6% in the June quarter and annual growth collapsed from 19.4% to 2.8%. Most of these people are building a retirement the government has shown it cannot fund. Trade-off: some investors do hoard, and a concession is not a plan.", "kind": "EVERGREEN", "filmWindow": "", "cta": "Share this with someone who blames landlords.", "disclaimer": "tax", "onScreen": "", "script": {"setup": "Carousel, build from the copy. Source credits: ATO taxation statistics. ABS Lending Indicators, June quarter 2026.", "order": 7, "slides": [["Cover", "Nine in ten property investors own one or two places. The greedy landlord is mostly fiction."], ["The ATO's own numbers (three columns)", "71% own one property · 19% own two · About 1% own six or more"], ["Who they are", "Nurses, tradies, teachers, small business owners. Mostly on ordinary incomes, mostly building a retirement they don't trust the government to fund."], ["What's happening now", "Investor loan numbers fell 8.6% in the June quarter. Annual growth went from 19.4% to 2.8%. The investors are leaving, not hoarding."], ["The trade-off", "Some investors do hoard. Some suburbs have been priced by investors. And negative gearing is a concession, not a plan."], ["The real problem", "1.2 million homes promised. Delivery is now 18 months late. You can't tax your way to a house that hasn't been built."], ["Close", "Blame the supply. / Not the nurse with one unit in Penrith."]], "disclaimerText": "General market commentary only, not advice. Anything to do with tax or structuring is your accountant's call, not mine.", "caption": "Nine in ten property investors own one or two places. The greedy landlord is mostly fiction.\n\nATO data: 71% of investors own one property, 19% own two. About 1% own six or more.\n\nAnd they're leaving. Investor loan numbers fell 8.6% in the June quarter. Annual growth collapsed from 19.4% to 2.8%.\n\nSome investors do hoard. Some suburbs have been priced by them. But the housing problem is 1.2 million homes promised and delivery running 18 months late.\n\nYou can't tax your way to a house that hasn't been built.\n\nShare this with someone who blames landlords.\n\nGeneral market commentary only, not advice. Anything to do with tax or structuring is your accountant's call, not mine. [credit rep line]\n\n#propertyinvestor #negativegearing #housingcrisis #australianproperty #mortgagebroker"}, "group": "market-economics", "bankId": null, "swapHistory": []}, {"id": "W1-06", "week": "W1", "date": "2026-09-21", "day": "Mon", "time": "06:45", "format": "Reel", "lane": "A", "pillar": 3, "type": "contrarian", "title": "Insurance from the person who sets the price", "hook": "Fixing your rate is buying insurance from the person who sets the price.", "angle": "The only one who wins on fixed over a full cycle is the bank. Right now the best fixed rates sit above the best variable, so fixing is a hedge against a rise, not a discount. Name who it is right for: the borrower who genuinely cannot hold a rise. Certainty has a price and that is fine if you know you are paying it.", "kind": "EVERGREEN", "filmWindow": "Not filmed 16 Sep. Film in one 45-minute sitting Thu 17 or Fri 18 morning, or roll into the Wed 23 Sep batch and post in week 2.", "cta": "", "disclaimer": "scenario", "onScreen": "Certainty has a price.", "script": {"setup": "Desk, phone, Lane A. Outfit 1.", "order": 2, "words": 93, "seconds": 35, "spoken": "Fixing your rate is buying insurance from the person who sets the price.\n\nOver a full cycle, variable has beaten fixed almost every time. The bank prices the fixed rate, and the bank is not in the business of losing that bet.\n\nRight now the best fixed rates sit above the best variable ones. So fixing today isn't a discount. It's a hedge.\n\nAnd a hedge is fine, if you know that's what you're buying.\n\nWho it's right for: the borrower who genuinely couldn't hold another rise.\n\nCertainty has a price. Just know you're paying it.", "onScreen": "Certainty has a price.", "numbers": "None. No rate numbers anywhere, above and below only.", "disclaimerText": "This is a scenario, not a forecast. General market commentary only, not advice.", "caption": "Fixing your rate is buying insurance from the person who sets the price.\n\nOver a full cycle, variable has beaten fixed almost every time. The bank sets the fixed price and it doesn't plan to lose.\n\nRight now fixed sits above variable, so fixing is a hedge, not a discount.\n\nWho it suits: the borrower who genuinely couldn't hold another rise. Certainty has a price. Know you're paying it.\n\nThis is a scenario, not a forecast. General market commentary only, not advice. [credit rep line]\n\n#fixedrate #mortgagebroker #homeloans #interestrates #australianproperty"}, "group": "bank-wont-say", "bankId": null, "swapHistory": []}, {"id": "W1-07", "week": "W1", "date": "2026-09-21", "day": "Mon", "time": "17:30", "format": "Carousel", "lane": "-", "pillar": 1, "type": "news", "title": "The dip they waited for is here", "hook": "Sydney is 7.1% off its peak and the buyers who waited for the dip are still waiting.", "angle": "Cotality August: national values down 0.9% in the month, fifth straight fall, 3.6% below the March peak. Sydney down 1.4%, 7.1% below February. 93% of capital city suburbs fell over winter, up from 46% in autumn. Sydney clearance 57.8% versus 77.1% a year ago. Trade-off: borrowing capacity fell too, and nobody rings a bell at the bottom.", "kind": "TOPICAL", "filmWindow": "Build on batch day. Refresh the clearance rate on Sunday 20 Sep before posting.", "cta": "Save this and read it again in March.", "disclaimer": "figures", "onScreen": "", "script": {"setup": "Carousel, build from the copy. Refresh the clearance rate with the 19 to 20 Sep weekend result before posting. Credits: Cotality Home Value Index, August 2026. Auction results, Cotality and Domain.", "order": 8, "slides": [["Cover", "Sydney is 7.1% off its peak and the buyers who waited for the dip are still waiting."], ["National, August (three columns)", "Down 0.9% in the month · Fifth straight fall · 3.6% below the March peak"], ["Sydney", "Down 1.4% in August. 7.1% below the February peak. A faster correction than 2022 to 2023."], ["How wide it is", "93% of capital city suburbs fell over winter. In autumn it was 46%."], ["Auctions", "Sydney clearance 57.8% last weekend. Same weekend last year: 77.1%."], ["The catch", "Your borrowing capacity fell too. This year's rate rises, tested through a 3% buffer, took more out of your number than the market gave back. And nobody rings a bell at the bottom."], ["Close", "You said you'd buy in the dip. / This is what one looks like from the inside."]], "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "Sydney is 7.1% off its peak and the buyers who waited for the dip are still waiting.\n\nCotality, August:\n→ national values down 0.9%, the fifth straight monthly fall, 3.6% below the March peak\n→ Sydney down 1.4%, 7.1% below February\n→ 93% of capital city suburbs fell over winter, up from 46% in autumn\n→ Sydney clearance 57.8% last weekend against 77.1% a year ago\n\nThe catch: your borrowing capacity fell too, and nobody rings a bell at the bottom.\n\nSave this and read it again in March.\n\nIllustrative only, not a quote or an offer. General market commentary, not advice. [credit rep line]\n\n#sydneyproperty #propertymarket #firsthomebuyer #australianproperty #mortgagebroker"}, "group": "market-economics", "bankId": null, "swapHistory": []}, {"id": "W1-08", "week": "W1", "date": "2026-09-22", "day": "Tue", "time": "06:45", "format": "Reel", "lane": "A", "pillar": 2, "type": "question", "title": "Does my HECS debt matter?", "hook": "Your HECS debt is costing you more borrowing power than your car loan.", "angle": "Client question this week. Lenders treat the compulsory repayment as a fixed monthly outgoing, scaled to your income band, so a five-figure balance can knock six figures off capacity. New this year: some lenders can ignore a HELP debt that will be cleared within about a year. Trade-off: paying it out of your deposit can leave you short on deposit. It is a trade, not a rule.", "kind": "EVERGREEN", "filmWindow": "Not filmed 16 Sep. Film in one 45-minute sitting Thu 17 or Fri 18 morning, or roll into the Wed 23 Sep batch and post in week 2.", "cta": "Comment HECS and I'll do the long version.", "disclaimer": "figures", "onScreen": "Balance $40k. Capacity gone: six figures.", "script": {"setup": "Desk, phone, Lane A. Outfit 2 (shirt change). The car works too, parked, engine off.", "order": 3, "words": 99, "seconds": 38, "spoken": "Your HECS debt is costing you more borrowing power than your car loan.\n\nA client asked this week whether a forty thousand dollar balance mattered. It matters more than the number suggests.\n\nLenders don't look at what you owe. They look at the repayment coming out of your pay, and they treat it like a loan you can't cancel.\n\nOn a typical calculator, that's six figures off what you can borrow.\n\nTwo things changed this year. Some lenders can now ignore a balance you'll clear within about a year. And paying it out of your deposit can leave you short on deposit.\n\nIt's a trade, not a rule.", "onScreen": "Balance $40k. Capacity gone: six figures.", "numbers": "\"$40,000\" at the balance line. \"Six figures\" at the calculator line.", "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "Your HECS debt is costing you more borrowing power than your car loan.\n\nLenders don't assess the balance. They assess the compulsory repayment leaving your pay each month, and treat it like a loan you can't cancel. On a typical calculator a $40k balance takes six figures off your capacity.\n\nTwo things changed this year:\n→ some lenders can ignore a balance you'll clear within about a year\n→ paying it out of your deposit can leave you short on deposit\n\nIt's a trade, not a rule. Comment HECS and I'll do the long version.\n\nIllustrative only, not a quote or an offer. General market commentary, not advice. [credit rep line]\n\n#hecs #firsthomebuyer #borrowingpower #mortgagebroker #homeloans"}, "group": "the-number", "bankId": null, "swapHistory": []}, {"id": "W2-01", "week": "W2", "date": "2026-09-23", "day": "Wed", "time": "12:30", "format": "Reel", "lane": "A", "pillar": 2, "type": "news", "title": "Investors have left the field", "hook": "Investor lending just fell off a cliff. Here's who that helps.", "angle": "ABS June quarter: investor loan numbers down 8.6%, value down 10.2%, annual growth from 19.4% to 2.8%. First home buyers down only 2.9%. Fewer bidders at the $800k to $1.2m end where investors and first home buyers collide. Trade-off: fewer investors also means fewer new rentals, and rents are already at a record share of income.", "kind": "TOPICAL", "filmWindow": "Films on batch day Wed 23 Sep. Data is a month old and stable.", "cta": "Send this to a first home buyer who thinks they're outbid by investors.", "disclaimer": "figures", "onScreen": "Investor loans: down 8.6%. Growth: 19.4% to 2.8%.", "group": "the-number", "bankId": null, "swapHistory": []}, {"id": "W2-02", "week": "W2", "date": "2026-09-27", "day": "Sun", "time": "08:30", "format": "Carousel", "lane": "-", "pillar": 3, "type": "contrarian", "title": "The lender your bank hopes you never hear about", "hook": "Your bank will never tell you there are 30 other places to get the loan.", "angle": "Most borrowers do not know non-bank lenders exist, and the bank that just said no has no reason to mention them. The comparison is not rate A versus rate B, it is getting in versus not getting in, and missing 12 to 24 months of growth costs more than a modest rate gap. Composite example, no lender named, no rates. Trade-off: non-banks reprice faster and some have fewer features.", "kind": "EVERGREEN", "filmWindow": "", "cta": "Save this if a bank has said no to you this year.", "disclaimer": "figures", "onScreen": "", "group": "bank-wont-say", "bankId": null, "swapHistory": []}, {"id": "W2-03", "week": "W2", "date": "2026-09-25", "day": "Fri", "time": "06:45", "format": "Reel", "lane": "B", "pillar": 4, "type": "mechanism", "title": "How a bank reads a self-employed borrower", "hook": "Your accountant saved you tax. It might have cost you a house.", "angle": "Deal breakdown, de-identified composite. A business owner on triple his PAYG mate's income was declined because his accountant had minimised taxable income for two years. Two years of returns, the lower-or-average rule, what gets added back (depreciation, one-off costs, interest on debts being refinanced) and what does not. Trade-off: some lenders read 12 months, at a cost. The fix is a conversation between your accountant and your broker before 31 October, not after.", "kind": "EVERGREEN", "filmWindow": "", "cta": "Send this to your accountant. Seriously.", "disclaimer": "tax", "onScreen": "Two years. Lower or average. Add-backs.", "group": "deal-breakdowns", "bankId": null, "swapHistory": []}, {"id": "W2-04", "week": "W2", "date": "2026-09-26", "day": "Sat", "time": "08:30", "format": "Carousel", "lane": "-", "pillar": 5, "type": "process", "title": "Eight posts in ninety minutes", "hook": "I film a week of content in one sitting. Here's the whole system.", "angle": "Behind the scenes of batch day. The shot list, the three shirts, the two takes maximum rule, the phone at the desk, why Wednesday. Photos from the day. Honest about what went wrong on the first one.", "kind": "EVERGREEN", "filmWindow": "", "cta": "Ask me anything about the setup in the comments.", "disclaimer": "general", "onScreen": "", "group": "the-journey", "bankId": null, "swapHistory": []}, {"id": "W2-05", "week": "W2", "date": "2026-09-24", "day": "Thu", "time": "12:30", "format": "Carousel", "lane": "-", "pillar": 1, "type": "contrarian", "title": "1,432 homes", "hook": "The government promised 1.2 million homes. Two years in, its flagship fund has built 1,432.", "angle": "The 1.2m target is now forecast to land at the end of 2030, 18 months late. The Housing Australia Future Fund has delivered 1,432 homes in two years. Removing negative gearing does not pour a slab. The constraint is supply and a trades shortage. Trade-off: investors are not blameless everywhere, but the maths of this problem is construction, not tax.", "kind": "EVERGREEN", "filmWindow": "", "cta": "Share this the next time someone says tax is the problem.", "disclaimer": "general", "onScreen": "", "group": "market-economics", "bankId": null, "swapHistory": []}, {"id": "W2-06", "week": "W2", "date": "2026-09-28", "day": "Mon", "time": "06:45", "format": "Reel", "lane": "A", "pillar": 3, "type": "contrarian", "title": "Two rates, one bank", "hook": "Your bank has two rates. One for you, one for the person who walked in yesterday.", "angle": "Loyalty tax, the day before the RBA decides. Dozens of lenders cut variable rates for new customers over the past month while existing customers sat still. The bank counts on you not asking. What to say on the phone, in one line, and why the fortnight around a decision is when they are most willing to move. Trade-off: a reprice rarely matches a full refinance, but it costs nothing. No rates quoted.", "kind": "TOPICAL", "filmWindow": "Films batch day Wed 23 Sep. Re-check on Sunday 27 Sep that banks are still cutting for new customers; if the market has turned, swap the first line.", "cta": "Send this to someone who hasn't called their bank in a year.", "disclaimer": "general", "onScreen": "One bank. Two rates. Guess which one is yours.", "group": "bank-wont-say", "bankId": null, "swapHistory": []}, {"id": "W2-07", "week": "W2", "date": "2026-09-28", "day": "Mon", "time": "17:30", "format": "Carousel", "lane": "-", "pillar": 2, "type": "mechanism", "title": "The number on your file that kills the deal", "hook": "There's a number on your file that can kill the deal before the rate matters.", "angle": "APRA's debt-to-income cap has been live since February: lenders can write no more than 20% of new loans at six times income or more. Total debt includes the new loan, cards, car, HECS. Household income $150k means roughly $900k of total debt before you are in the capped bucket. Who it hits first: investors on their second and third loan. Trade-off: it is a cap on the lender's book, not a hard no to you, and a good broker knows which lenders have room.", "kind": "EVERGREEN", "filmWindow": "", "cta": "Save this. You'll want it before your next purchase.", "disclaimer": "figures", "onScreen": "", "group": "the-number", "bankId": null, "swapHistory": []}, {"id": "W2-08", "week": "W2", "date": "2026-09-29", "day": "Tue", "time": "15:15", "format": "Reel", "lane": "A", "pillar": 1, "type": "news", "title": "RBA decision react", "hook": "VARIANT A (rise): They raised. Here's the one thing that changes for you today. VARIANT B (hold): They held. Don't read that as the top.", "angle": "Live react, filmed 2:45 to 3:00pm after the 2:30pm decision. Both scripts pre-written in the shot list. Angle for either outcome: what it changes for someone with a settlement in the next 90 days. Your capacity is tested at the rate plus a 3% buffer, so a quarter-point move shifts borrowing power by roughly 2 to 3% (illustrative). Never a rate, never a product.", "kind": "TOPICAL", "filmWindow": "Tue 29 Sep, 2:45 to 3:00pm. Phone at the desk. Post by 3:15pm.", "cta": "Send this to anyone with a settlement before Christmas.", "disclaimer": "scenario", "onScreen": "Settling before Christmas? Watch this.", "group": "market-economics", "bankId": null, "swapHistory": []}], "stories": {"2026-09-16": "AM: batch day begins, phone on the tripod, the shot list on screen (P5). Midday: share W1-01 with the line 'banks are cutting, the RBA might not be'. PM: poll, 'has your bank cut your rate this year, or only new customers?'", "2026-09-17": "AM: share the ABC mortgage war piece with one line: the discount goes to whoever asks. Midday: share W1-02, 'seven lenders changed the calculator, here's what it means'. PM: quiz, 'guess how much investor borrowing power fell'.", "2026-09-18": "AM: share W1-03 with 'the structure your bank hopes you never question'. Midday: RBA Governor at House Economics today, share any quotable line with a one-line take. PM: BTS of the edit, 'two takes max, here's take two'.", "2026-09-19": "AM: share W1-04, '742 to 10,000, in public, follow along'. Midday: screenshot of the dashboard with the streak counter at zero. PM: poll, 'what do you want more of: numbers, structure, or the behind-the-scenes?'", "2026-09-20": "AM: share W1-05, 'nine in ten investors own one or two'. Midday: auction results from yesterday, one line on the clearance rate. PM: Sunday reset, tomorrow's two posts teased.", "2026-09-21": "AM: share W1-06, 'insurance from the person who sets the price'. Midday: question box, 'fixed or variable, and why?'. PM: share W1-07, 'the dip they waited for'.", "2026-09-22": "AM: share W1-08, 'HECS costs more capacity than your car loan'. Midday: Bullock CEDA fireside today, share if quotable. PM: week 1 wrap, eight of eight or not, said plainly. Tomorrow's batch day teased.", "2026-09-23": "AM: batch day two, shirt count. Midday: share W2-01, 'investors have left the field'. PM: poll, 'first home buyer or investor: who is winning spring?'", "2026-09-24": "AM: share W2-02, 'rate A vs rate B is the wrong fight'. Midday: news share, whatever the lead property story is. PM: question box, 'has a bank said no to you this year?'", "2026-09-25": "AM: share W2-03, 'send this to your accountant'. Midday: school holidays start, note it as a confounder in public. PM: BTS, the Lane B two-camera setup.", "2026-09-26": "AM: share W2-04, 'eight posts in ninety minutes'. Midday: auction day, one line at 6pm on Sydney clearance. PM: poll, 'which post this week did you actually watch to the end?'", "2026-09-27": "AM: share W2-05, '1,432 homes'. Midday: first Sunday review tonight, say so. PM: the review headline: hit rate, best post, the one change, screenshot of the dashboard.", "2026-09-28": "AM: share W2-06, 'your bank has two rates', with 'RBA decides tomorrow, call today'. Midday: market pricing screenshot with the scenario disclaimer. PM: share W2-07, 'the number on your file'.", "2026-09-29": "AM: RBA day, 'decision at 2:30, reel by 3:15'. 2:35pm: the outcome, one line, no forecast. 3:15pm: share W2-08. PM: poll, 'did your bank announce yet?'"}, "growth": [{"date": "2026-09-14", "count": 742, "source": "Matt, reported in brief"}], "bank": [{"id": "R-P1-01", "group": "market-economics", "groupLabel": "The market and the economics", "pillar": 1, "format": "Reel", "lane": "A", "type": "correction", "title": "A cut doesn't mean your repayment moves", "hook": "The RBA moves and your repayment doesn't. Here's why.", "angle": "Pass through is a decision, not a rule. Lenders choose how much and when.", "cta": "Follow for the number behind the headline.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "RBA moves. Your repayment doesn't. Pass through is a decision, not a rule.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 81, "seconds": 28, "spoken": "The RBA moves, the headline says rates are down, and your repayment doesn't budge.\n\nThat's not a mistake. Passing a cut on is a decision your lender makes, not a rule it follows. They choose how much of it you get, and when it starts.\n\nSo a cut isn't money in your account. It's a reason to ring up and ask a question.\n\nThe people who get the full move are the ones who ask. Everyone else gets what they're given.", "onScreen": "RBA moves. Your repayment doesn't. Pass through is a decision, not a rule.", "numbers": "None. Never quote a rate or a pass through percentage.", "disclaimerText": "General market commentary only, not advice.", "caption": "The RBA moves, the headline says rates are down, and your repayment doesn't budge.\n\nThat's not an error. Passing a cut on is a decision your lender makes. How much. And when.\n\nA cut isn't money in your account. It's a reason to ring up and ask a question.\n\nThe people who get the full move are the ones who ask. Everyone else gets what they're given.\n\nFollow for the number behind the headline.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#rba #interestrates #mortgagebroker #homeloans #australianproperty"}}, {"id": "R-P1-02", "group": "market-economics", "groupLabel": "The market and the economics", "pillar": 1, "format": "Reel", "lane": "A", "type": "contrarian", "title": "The dip arrived and nobody bought it", "hook": "The dip everyone said they were waiting for showed up. Almost nobody bought.", "angle": "Prices fell and so did borrowing power, which is why the dip didn't feel like one.", "cta": "Save this and read it again in March.", "kind": "TOPICAL", "disclaimer": "figures", "onScreen": "7.1% below peak. 93% of suburbs fell. And your budget fell too.", "expires": "2026-10-31", "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 85, "seconds": 30, "spoken": "The dip everyone said they were waiting for showed up. Almost nobody bought.\n\nSydney is 7.1% below its February peak. Five straight monthly falls nationally. 93% of capital city suburbs fell over winter, up from 46% in autumn.\n\nThat's a dip by any definition.\n\nHere's why it didn't feel like one. Your borrowing power fell at the same time. You're tested at your rate plus a 3% buffer, so when rates rise your number falls.\n\nPrices came to you. Your budget went the other way.", "onScreen": "7.1% below peak. 93% of suburbs fell. And your budget fell too.", "numbers": "Cotality August 2026: national down 0.9% in the month, fifth straight fall, 3.6% below the March peak. Sydney down 1.4%, 7.1% below February. 93% of capital city suburbs fell over winter vs 46% in autumn.", "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "The dip everyone said they were waiting for showed up. Almost nobody bought.\n\nCotality, August:\n→ Sydney 7.1% below its February peak\n→ five straight monthly falls nationally, 3.6% off the March peak\n→ 93% of capital city suburbs fell over winter, up from 46% in autumn\n\nThat is a dip by any definition.\n\nHere's why it didn't feel like one. Your borrowing power fell at the same time. You're assessed at your rate plus a 3% buffer, so when rates go up your number comes down.\n\nPrices came to you. Your budget went the other way.\n\nSave this and read it again in March.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#sydneyproperty #propertymarket #firsthomebuyer #australianproperty #mortgagebroker"}}, {"id": "R-P1-03", "group": "market-economics", "groupLabel": "The market and the economics", "pillar": 1, "format": "Reel", "lane": "A", "type": "contrarian", "title": "You can't tax your way to a house", "hook": "The government promised 1.2 million homes. Its flagship fund has built 1,432.", "angle": "Supply is the constraint, not tax. Name the trade-off both ways.", "cta": "Share this next time someone says tax is the problem.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "1.2 million promised. 1,432 delivered.", "expires": null, "confirm": "HAFF delivery count and the 1.2m target timing. Confirm before posting.", "used": [], "script": {"setup": "Desk, straight to camera", "words": 80, "seconds": 28, "spoken": "The government promised 1.2 million homes. Two years in, its flagship fund has delivered 1,432.\n\nNot 1,432 thousand. 1,432.\n\nEvery housing argument in this country ends up being about negative gearing. Negative gearing has never poured a slab, trained a chippy, or approved a DA.\n\nThe honest other side: investors aren't blameless, and a tax concession isn't a housing plan.\n\nBut the maths of this problem is construction. You cannot tax your way to a house that hasn't been built.", "onScreen": "1.2 million promised. 1,432 delivered.", "numbers": "Housing Australia Future Fund delivery to date: 1,432 homes. 1.2m National Housing Accord target forecast about 18 months late. [CONFIRM both against a primary source on the day of posting.]", "disclaimerText": "General market commentary only, not advice.", "caption": "The government promised 1.2 million homes. Two years in, its flagship fund has delivered 1,432.\n\nNot 1,432 thousand. 1,432.\n\nEvery housing argument in this country ends up being about negative gearing. Negative gearing has never poured a slab, trained a chippy or approved a DA.\n\nThe honest other side: investors aren't blameless everywhere, and a tax concession isn't a housing plan.\n\nBut the maths of this problem is construction.\n\nYou can't tax your way to a house that hasn't been built.\n\nShare this the next time someone says tax is the problem.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#housingcrisis #australianproperty #negativegearing #housingsupply #mortgagebroker"}}, {"id": "R-P1-04", "group": "market-economics", "groupLabel": "The market and the economics", "pillar": 1, "format": "Reel", "lane": "A", "type": "news", "title": "The investors left and it didn't help you", "hook": "Investor lending fell off a cliff. First home buyers barely moved. Here's who that helps.", "angle": "Fewer investors at the $800k to $1.2m end, but fewer new rentals too.", "cta": "Send this to a first home buyer who thinks investors outbid them.", "kind": "TOPICAL", "disclaimer": "figures", "onScreen": "Investor loans down 8.6%. First home buyers down 2.9%.", "expires": "2026-11-11", "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 83, "seconds": 29, "spoken": "Investor lending just fell off a cliff and first home buyers barely moved.\n\nJune quarter: investor loan numbers down 8.6%, value down 10.2%. Annual growth went from 19.4% to 2.8%. First home buyers, down 2.9%.\n\nIf you've been telling yourself an investor keeps outbidding you, there are fewer of them in the room than a year ago, especially between $800,000 and $1.2 million.\n\nThe catch is real. Fewer investors buying means fewer new rentals, and rents already take a record share of income.", "onScreen": "Investor loans down 8.6%. First home buyers down 2.9%.", "numbers": "ABS Lending Indicators June quarter 2026: investor loan numbers down 8.6%, value down 10.2%, annual growth 19.4% to 2.8%. First home buyers down 2.9%.", "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "Investor lending just fell off a cliff and first home buyers barely moved.\n\nABS, June quarter:\n→ investor loan numbers down 8.6%, value down 10.2%\n→ annual growth from 19.4% to 2.8%\n→ first home buyers down only 2.9%\n\nIf you've been telling yourself an investor keeps outbidding you, there are fewer of them in the room than a year ago, especially between $800k and $1.2m where you collide.\n\nThe catch: fewer investors buying also means fewer new rentals, and rents already take a record share of income.\n\nThe field cleared. The floor didn't.\n\nSend this to a first home buyer who thinks they're being outbid by investors.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#firsthomebuyer #propertyinvestor #australianproperty #mortgagebroker #propertymarket"}}, {"id": "C-P1-01", "group": "market-economics", "groupLabel": "The market and the economics", "pillar": 1, "format": "Carousel", "lane": "-", "type": "news", "title": "The dip they waited for is here", "hook": "Sydney is 7.1% off its peak and the buyers who waited for the dip are still waiting.", "angle": "The dip arrived and capacity fell with it.", "cta": "Save this and read it again in March.", "kind": "TOPICAL", "disclaimer": "figures", "onScreen": "Sydney is 7.1% off its peak and the buyers who waited for the dip are still waiting.", "expires": "2026-10-31", "confirm": "Refresh the clearance rate for the most recent weekend before posting.", "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "Sydney is 7.1% off its peak and the buyers who waited for the dip are still waiting."], ["National, August", "Down 0.9% in the month, fifth straight fall, 3.6% below the March peak"], ["Sydney", "Down 1.4% in August. 7.1% below the February peak. A faster correction than 2022 to 2023."], ["How wide it is", "93% of capital city suburbs fell over winter. In autumn it was 46%."], ["Auctions", "Sydney clearance 57.8% last weekend. Same weekend last year: 77.1%."], ["The catch", "Your borrowing capacity fell too. This year's rate rises, tested through a 3% buffer, took more out of your number than the market gave back. And nobody rings a bell at the bottom."], ["Close", "You said you'd buy in the dip. This is what one looks like from the inside."]], "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "Sydney is 7.1% off its peak and the buyers who waited for the dip are still waiting.\n\nCotality, August:\n→ national values down 0.9%, the fifth straight monthly fall, 3.6% below the March peak\n→ Sydney down 1.4%, 7.1% below February\n→ 93% of capital city suburbs fell over winter, up from 46% in autumn\n→ Sydney clearance 57.8% last weekend against 77.1% a year ago\n\nThe catch: your borrowing capacity fell too, and nobody rings a bell at the bottom.\n\nSave this and read it again in March.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#sydneyproperty #propertymarket #firsthomebuyer #australianproperty #mortgagebroker"}}, {"id": "C-P1-02", "group": "market-economics", "groupLabel": "The market and the economics", "pillar": 1, "format": "Carousel", "lane": "-", "type": "contrarian", "title": "The greedy landlord is mostly fiction", "hook": "Nine in ten property investors own one or two places. The greedy landlord is mostly fiction.", "angle": "ATO ownership data against the public story, then the supply point.", "cta": "Share this with someone who blames landlords.", "kind": "EVERGREEN", "disclaimer": "tax", "onScreen": "Nine in ten property investors own one or two places. The greedy landlord is mostly fiction.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "Nine in ten property investors own one or two places. The greedy landlord is mostly fiction."], ["The ATO's own numbers", "71% own one property, 19% own two, about 1% own six or more"], ["Who they are", "Nurses, tradies, teachers, small business owners. Mostly on ordinary incomes, mostly building a retirement they don't trust the government to fund."], ["What's happening now", "Investor loan numbers fell 8.6% in the June quarter. Annual growth went from 19.4% to 2.8%. The investors are leaving, not hoarding."], ["The trade-off", "Some investors do hoard. Some suburbs have been priced by investors. And negative gearing is a concession, not a plan."], ["The real problem", "1.2 million homes promised. Delivery is now 18 months late. You can't tax your way to a house that hasn't been built."], ["Close", "Blame the supply. Not the nurse with one unit in Penrith."]], "disclaimerText": "Anything to do with tax or structuring is your accountant's call, not mine. General market commentary only, not advice.", "caption": "Nine in ten property investors own one or two places. The greedy landlord is mostly fiction.\n\nATO data: 71% of investors own one property, 19% own two. About 1% own six or more.\n\nAnd they're leaving. Investor loan numbers fell 8.6% in the June quarter. Annual growth collapsed from 19.4% to 2.8%.\n\nSome investors do hoard. Some suburbs have been priced by them. But the housing problem is 1.2 million homes promised and delivery running 18 months late.\n\nYou can't tax your way to a house that hasn't been built.\n\nShare this with someone who blames landlords.\n\n*Anything to do with tax or structuring is your accountant's call, not mine. General market commentary only, not advice.* [credit rep line]\n\n#propertyinvestor #negativegearing #housingcrisis #australianproperty #mortgagebroker"}}, {"id": "C-P1-03", "group": "market-economics", "groupLabel": "The market and the economics", "pillar": 1, "format": "Carousel", "lane": "-", "type": "contrarian", "title": "1,432 homes", "hook": "The government promised 1.2 million homes. Two years in, its flagship fund has built 1,432.", "angle": "Supply, not tax, is the binding constraint.", "cta": "Share this the next time someone says tax is the problem.", "kind": "EVERGREEN", "disclaimer": "general", "onScreen": "The government promised 1.2 million homes. Two years in, its flagship fund has built 1,432.", "expires": null, "confirm": "HAFF delivery count and target timing. Confirm before posting.", "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "The government promised 1.2 million homes. Two years in, its flagship fund has built 1,432."], ["Read that again", "1,432. Not 1,432 thousand. One thousand four hundred and thirty two."], ["The target", "1.2 million homes by mid 2029. Now forecast to land around the end of 2030, about 18 months late."], ["What actually stops a house", "Land release. Council approval times. A trades shortage. The cost of materials. None of those are tax settings."], ["The trade-off", "Investors aren't blameless everywhere, and a concession that mostly helps people who already own something is a fair thing to argue about."], ["But", "Removing it doesn't pour a slab. The argument we keep having is not the argument that builds houses."], ["Close", "You can't tax your way to a house that hasn't been built."]], "disclaimerText": "General market commentary only, not advice.", "caption": "The government promised 1.2 million homes. Two years in, its flagship fund has built 1,432.\n\nRead that again. Not 1,432 thousand. 1,432.\n\nThe target is now forecast to land about 18 months late.\n\nWhat actually stops a house getting built: land release, approval times, a trades shortage, the cost of materials. None of those are tax settings.\n\nThe fair argument on the other side: a concession that mostly helps people who already own something is worth debating.\n\nBut removing it doesn't pour a slab.\n\nShare this the next time someone says tax is the problem.\n\n*General market commentary only, not advice.* [credit rep line]\n\n#housingcrisis #housingsupply #australianproperty #negativegearing #mortgagebroker"}}, {"id": "C-P1-04", "group": "market-economics", "groupLabel": "The market and the economics", "pillar": 1, "format": "Carousel", "lane": "-", "type": "news", "title": "What one 0.25% move costs you", "hook": "One 0.25% move on a $700,000 loan is $1,358 a year. Same house, same loan.", "angle": "The mechanism, then the number, then the trade-off on fixing.", "cta": "Comment FIXED and I'll run your numbers.", "kind": "TOPICAL", "disclaimer": "figures", "onScreen": "One 0.25% move on a $700,000 loan is $1,358 a year. Same house, same loan.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Canva, no camera", "slides": [["Cover", "One 0.25% move on a $700,000 loan is $1,358 a year. Same house, same loan."], ["Fixed rates don't follow the RBA", "They follow what the market thinks the RBA does next. That's why fixed rates can move weeks before a decision, or without one at all."], ["The number", "$700,000 over 30 years, principal and interest. 6.00%: about $4,197 a month. 6.25%: about $4,310 a month."], ["The gap", "$113 a month. $1,358 a year. Illustrative only, and nothing here is a rate on any product."], ["What fixing actually is", "Not a prediction. You're buying certainty, and certainty has a price."], ["The catch", "Most fixed loans take your offset and your extra repayments away. If you might sell, refinance or throw money at it, that costs more than the rate gap."], ["Close", "Fix because you can't hold a rise. Not because you think you know what happens next."]], "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "One 0.25% move on a $700,000 loan is $1,358 a year. Same house, same loan.\n\nFixed rates don't follow the RBA. They follow what the market thinks the RBA does next, which is why they move before a decision, or without one at all.\n\nThe number, 30 years, principal and interest:\n→ 6.00%: about $4,197 a month\n→ 6.25%: about $4,310 a month\n→ the gap: $113 a month, $1,358 a year\n\nFixing isn't a prediction. You're buying certainty, and certainty has a price.\n\nThe catch nobody mentions: most fixed loans take your offset and your extra repayments away. If you might sell, refinance or pay it down hard, that costs more than the rate gap.\n\nFix because you can't hold a rise. Not because you think you know what happens next.\n\nComment FIXED and I'll run your numbers.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#fixedrates #rba #mortgagebroker #homeloans #borrowingpower"}}, {"id": "R-P2-01", "group": "the-number", "groupLabel": "The Number", "pillar": 2, "format": "Reel", "lane": "A", "type": "mechanism", "title": "Your HECS is a deduction, not a debt", "hook": "POV: your HECS isn't a debt, it's a deduction, and every bank counts it differently", "angle": "The mechanism, then the turn: not every lender treats it the same way.", "cta": "Comment HECS and I'll show you what yours is costing you.", "kind": "EVERGREEN", "disclaimer": "figures", "onScreen": "Your salary / minus HECS / = what the bank lends on / unless it isn't", "expires": null, "confirm": "Run your own calculator for the gap figure before filming.", "used": [], "script": {"setup": "Desk, straight to camera", "words": 91, "seconds": 32, "spoken": "Your HECS isn't a debt. It's a deduction. It comes out before the money hits your account.\n\nYour bank sees it differently. It sees a compulsory payment coming out of your income every month that you can't pause, so it comes off before they work out what you can borrow.\n\nExcept not every lender does it the same way. Some count the whole repayment, some barely count it, and some drop it entirely if you're close to clearing the balance.\n\nSame salary, same HECS, different answer depending on who you ask.", "onScreen": "Your salary / minus HECS / = what the bank lends on / unless it isn't", "numbers": "[CONFIRM] the borrowing power gap on your own calculator. A $120,000 salary with and without a HECS balance.", "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "Your HECS isn't a debt. It's a deduction.\n\nIt comes out before the money hits your account. You've never written a cheque for it and you've probably never thought about it.\n\nYour bank thinks about it. It sees a compulsory payment coming out of your income every month that you can't pause and can't clear early to make it stop counting. So it comes off your income before they work out what you can borrow.\n\nExcept not every lender treats it the same way. Some count the full repayment. Some barely count it. Some drop it entirely if the balance is close to gone.\n\nSame salary. Same HECS. Different number at the end, depending on who your application lands with.\n\nComment HECS and I'll show you what yours is costing you.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#hecsdebt #borrowingpower #firsthomebuyer #mortgagebroker #youngprofessionals"}}, {"id": "R-P2-02", "group": "the-number", "groupLabel": "The Number", "pillar": 2, "format": "Reel", "lane": "A", "type": "mechanism", "title": "Year one on a million dollar loan", "hook": "POV: you pay $71,946 this year and $12,280 of it is actually yours", "angle": "The POV arithmetic reveal. What a year of repayments actually buys you in year one.", "cta": "Follow for the number behind the headline.", "kind": "EVERGREEN", "disclaimer": "figures", "onScreen": "$71,946 paid. $12,280 yours.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 86, "seconds": 30, "spoken": "On a one million dollar loan at 6%, over 30 years, your repayment is about $5,996 a month.\n\nThat's $71,946 this year.\n\nHere's the part nobody shows you. Of that $71,946, about $12,280 comes off what you owe.\n\nThe other $59,666 is rent. You're renting the money.\n\nFive years in, you've paid roughly $359,730 and your balance has moved about $69,000.\n\nThis isn't an argument against buying. It's an argument for knowing what the first few years actually are, so an extra repayment stops feeling optional.", "onScreen": "$71,946 paid. $12,280 yours.", "numbers": "$1,000,000 over 30 years at 6.00% principal and interest. Repayment $5,996/mo. Year one: $71,946 paid, $12,280 principal, $59,666 interest. Five years: $359,730 paid, about $69,456 off the balance. Calculated, illustrative, not a rate on any product.", "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "POV: you pay $71,946 this year and $12,280 of it is actually yours.\n\nA $1,000,000 loan at 6%, 30 years, principal and interest. About $5,996 a month.\n\nYear one:\n→ $71,946 paid\n→ $12,280 off what you owe\n→ $59,666 of rent on the money\n\nFive years in you've paid about $359,730 and your balance has moved roughly $69,000.\n\nThis isn't an argument against buying. It's an argument for knowing what the first few years actually are, so an extra repayment stops feeling optional.\n\nFollow for the number behind the headline.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#mortgage #homeloans #thenumber #mortgagebroker #firsthomebuyer"}}, {"id": "R-P2-03", "group": "the-number", "groupLabel": "The Number", "pillar": 2, "format": "Reel", "lane": "A", "type": "correction", "title": "Your rent is a $542,000 loan", "hook": "POV: you pay $750 a week in rent and get told you can't afford a mortgage", "angle": "Converts rent into the loan it services. Hits the core wound directly.", "cta": "Send this to whoever told you to wait.", "kind": "EVERGREEN", "disclaimer": "figures", "onScreen": "$750/wk rent = a $542,000 loan. Tested at 9%, not 6%.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 92, "seconds": 32, "spoken": "You pay $750 a week in rent.\n\nAt 6% over 30 years, that same money services a loan of about $542,000.\n\nAnd you've been told you can't afford a mortgage.\n\nHere's why both are true. The bank doesn't test you at 6%. It tests you at your rate plus a 3% buffer, so it's asking whether you could handle 9%. On a million dollar loan that's about $5,996 a month against about $8,046.\n\nYou're not being told you can't afford it. You're being told you can't afford it if everything gets worse.", "onScreen": "$750/wk rent = a $542,000 loan. Tested at 9%, not 6%.", "numbers": "$750/wk = $3,250/mo, which services about $542,000 over 30 years at 6.00% P&I. $1,000,000 at 6.00% is about $5,996/mo; at 9.00% about $8,046/mo. Calculated, illustrative.", "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "You pay $750 a week in rent. At 6% over 30 years that same money services a loan of about $542,000.\n\nAnd you've been told you can't afford a mortgage.\n\nBoth are true, and here's why.\n\nThe bank doesn't test you at 6%. It tests you at your rate plus a 3% buffer. So it's really asking whether you could handle 9%.\n\nOn a $1,000,000 loan that's about $5,996 a month at 6%, against about $8,046 at 9%.\n\nYou're not being told you can't afford it. You're being told you can't afford it if everything gets worse.\n\nThat's a different sentence, and it changes what you do next.\n\nSend this to whoever told you to wait.\n\n*Illustrative only, not a quote or an offer. General market commentary, not advice.* [credit rep line]\n\n#rentvsbuy #firsthomebuyer #borrowingpower #mortgagebroker #sydneyproperty"}}, {"id": "R-P2-04", "group": "the-number", "groupLabel": "The Number", "pillar": 2, "format": "Reel", "lane": "A", "type": "mechanism", "title": "They test you at 9%, not 6%", "hook": "POV: the bank isn't asking if you can afford your rate. It's asking about 9%.", "angle": "The buffer, in one number, and why your approval came back low.", "cta": "Save this before your next application.", "kind": "EVERGREEN", "disclaimer": "figures", "onScreen": "You'd pay $5,996. They test $8,046.", "expires": null, "confirm": null, "used": [], "script": {"setup": "Desk, straight to camera", "words": 90, "seconds": 32, "spoken": "Your borrowing power came back tens of thousands below what you expected and nobody explained why.\n\nHere it is. The bank doesn't assess you at the rate you'll pay. It assesses you at that rate plus a 3% buffer.\n\nOn a million dollar loan, you'd pay about $5,996 a month. They test whether you could pay about $8,046.\n\nThat's a $2,050 a month gap you clear before they lend you a cent.\n\nIt's not personal. It's the rule every lender works under. But it's why your number came back low.", "onScreen": "You'd pay $5,996. They test $8,046.", "numbers": "$1,000,000 over 30 years: 6.00% about $5,996/mo, 9.00% about $8,046/mo, gap about $2,050. The 3% serviceability buffer is APRA's standard. Illustrative, not a rate on any product.", "disclaimerText": "Illustrative only, not a quote or an offer. General market commentary, not advice.", "caption": "Your borrowing power came back well below what you expected and nobody explained why.\n\nHere it is.\n\nThe bank doesn't assess you at the rate you'll pay. It assesses you at that rate plus a 3% buffer.\n\nOn a $1,000,000 loan:\n→ what you'd actually pay: about $5,996 a month\n→ what they test: about $8,046 a month\n→ the gap you have to clear first: about $2,050 a
